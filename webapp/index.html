<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MarkovBot Multi-Terminal Manager + AI</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #dcdcdc; padding: 15px; font-size: 13px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Global Log Style */
        #globalLog { background: #000; border: 1px solid #444; height: 120px; overflow-y: scroll; padding: 8px; font-family: monospace; font-size: 11px; margin-bottom: 10px; border-radius: 4px; color:#dcdcdc }
        
        .controls { background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; }
        
        /* Tab System */
        .tabs { display: flex; overflow-x: auto; background: #333; border-radius: 5px 5px 0 0; border: 1px solid #444; border-bottom: none; }
        .tab-btn { padding: 10px 20px; background: none; border: none; color: #fff; cursor: pointer; border-right: 1px solid #444; }
        .tab-btn.active { background: #444; color: #00ff00; font-weight: bold; }
        .tab-content { background: #000; border: 1px solid #444; height: 350px; overflow-y: scroll; padding: 10px; font-family: monospace; border-radius: 0 0 5px 5px; color: #00ff00; }
        
        input, textarea { width: 100%; background: #000; color: #00ff00; border: 1px solid #555; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-red { background: #cc0000; margin-left: 10px; padding: 4px 8px; font-size: 10px; }
        .maker-tag { font-size: 11px; color: #777; text-align: center; display: block; margin-top: 20px; font-style: italic; }
        .chat-line { margin-bottom: 4px; border-bottom: 1px solid #111; }
        
        /* AI Section Styles */
        .ai-controls { background: #1e1e1e; padding: 12px; border-radius: 6px; border: 1px solid #333; margin-bottom: 10px; }
        .ai-status { font-size: 11px; color: #aaa; margin-top: 5px; }
        .ai-status.connected { color: #00ff00; }
        .ai-status.disconnected { color: #ff5555; }
        
        /* Notify panel styles */
        .notify-controls { padding: 10px; border-bottom: 1px solid #333; display:flex; gap:8px; align-items:center; }
        .notify-list { height: 200px; overflow-y: auto; background: #0b0b0b; border-top: 1px solid #222; padding: 8px; font-family: monospace; font-size: 12px; }
        .notify-item { padding: 6px; border-bottom: 1px solid #111; cursor: pointer; }
        .notify-item.selected { background: rgba(0,255,0,0.06); }
        .notify-meta { color: #999; font-size: 11px; }
        .notify-reply { margin-top: 8px; }
        .small { font-size: 11px; padding: 6px; }
        .big { padding: 12px 18px; font-size: 14px; }
        
        /* AI Response Styling */
        .ai-response { border-left: 3px solid #0066cc; padding-left: 10px; margin: 8px 0; background: rgba(0,102,204,0.05); }
        .ai-thinking { color: #aaa; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h3>🌐 Global Connection Log</h3>
    <div id="globalLog"></div>

    <!-- AI Configuration Section -->
    <div class="ai-controls">
        <strong>🤖 Mistral AI Configuration</strong>
        <div style="display: flex; gap: 5px; margin-top: 8px;">
            <input type="password" id="mistralApiKey" placeholder="Enter your Mistral API key" style="flex: 1;">
            <button onclick="saveApiKey()">Save Key</button>
            <button onclick="testAiConnection()">Test Connection</button>
        </div>
        <div id="aiStatus" class="ai-status">API key not configured</div>
    </div>

    <div class="controls">
        <div style="display:flex; gap: 5px;">
            <input type="text" id="newRoom" placeholder="Enter room name (e.g. test)">
            <button onclick="addRoom()">Connect & Open Terminal</button>
        </div>
    </div>

    <div class="tabs" id="tabBar">
        <button class="tab-btn" id="btn-notify" onclick="switchTab('notify')">💬 Direct Chat</button>
    </div>
    <div id="terminalContainer">
        <div class="tab-content" id="term-notify" style="display:none;">
            <div class="notify-controls">
                <label><input type="checkbox" id="notifyEnable"> Enable</label>
                <label style="margin-left:8px;"><input type="checkbox" id="notifyAutoScroll"> Auto-scroll</label>
                <input type="text" id="notifyUsername" placeholder="Reply username" style="flex:1; max-width:220px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                <button class="small" onclick="saveUsername()">Save</button>
            </div>
            <div id="notifyList" class="notify-list"></div>
            <div class="notify-reply">
                <div class="notify-meta">Selected: <span id="notifySelected">(none)</span></div>
                <textarea id="notifyReplyText" rows="3" placeholder="Write your reply here..."></textarea>
                <div style="display:flex; gap:8px; margin-top:6px;">
                    <button onclick="sendInlineReply()">Send (Inline)</button>
                    <button onclick="sendNonInlineReply()" class="small">Send (Separate)</button>
                </div>
                <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
                    <input id="nullRoom" placeholder="room for null thread (e.g. test)" style="flex:1; max-width:300px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                    <button class="big" onclick="sendToNullThread()">SEND TO NULL THREAD</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls" style="margin-top:20px;">
        <strong>🧠 Brain Management (Text-Based JSON):</strong>
        <textarea id="brainText" rows="2"></textarea>
        <button onclick="exportBrain()">Show Current Brain</button>
        <button onclick="importBrain()">Apply Text to Brain</button>
    </div>

    <span class="maker-tag">Maker: peterforever + gemini + mistral</span>
</div>

<script>
    // Brain stores n-grams for n=1..4
    var brain = { 1: {}, 2: {}, 3: {}, 4: {} };
    var connections = {};
    var BOT_NAME = 'markovbot';
    var activeTab = null;
    var mistralApiKey = null;

    // Notify panel state
    var notifyEnabled = false;
    var notifyAutoScroll = true;
    var recentMessages = [];
    var maxMessages = 200;
    var selectedMessage = null;
    var currentUserName = BOT_NAME;

    // AI State
    var aiBusy = false;

    // ---------- LOCALSTORAGE PERSISTENCE ----------
    function saveBrain() {
        try {
            localStorage.setItem('markov_brain', JSON.stringify(brain));
        } catch(e) {
            gLog("⚠️ Failed to save brain: " + e);
        }
    }

    function loadBrain() {
        try {
            var data = localStorage.getItem('markov_brain');
            if (data) {
                brain = JSON.parse(data);
                gLog("🧠 Brain loaded from local storage.");
            }
        } catch(e) {
            gLog("⚠️ Failed to load brain: " + e);
        }
    }

    function saveRooms() {
        try {
            var rooms = Object.keys(connections);
            localStorage.setItem('markov_rooms', JSON.stringify(rooms));
        } catch(e) {
            gLog("⚠️ Failed to save rooms: " + e);
        }
    }

    function loadRooms() {
        try {
            var data = localStorage.getItem('markov_rooms');
            if (data) {
                var rooms = JSON.parse(data);
                rooms.forEach(function(room) {
                    if (!connections[room]) {
                        addRoom(room);
                    }
                });
            }
        } catch(e) {
            gLog("⚠️ Failed to load rooms: " + e);
        }
    }

    // ---------- AI KEY MANAGEMENT ----------
    function saveApiKey() {
        mistralApiKey = document.getElementById('mistralApiKey').value.trim();
        if (mistralApiKey) {
            try {
                // Store encrypted in sessionStorage (cleared when tab closes)
                sessionStorage.setItem('mistral_api_key', mistralApiKey);
                updateAiStatus(true);
                gLog("🔑 Mistral API key saved to session storage");
            } catch(e) {
                gLog("⚠️ Failed to save API key: " + e);
            }
        } else {
            sessionStorage.removeItem('mistral_api_key');
            mistralApiKey = null;
            updateAiStatus(false);
        }
        document.getElementById('mistralApiKey').value = '';
    }

    function loadApiKey() {
        try {
            mistralApiKey = sessionStorage.getItem('mistral_api_key');
            if (mistralApiKey) {
                updateAiStatus(true);
            }
        } catch(e) {
            gLog("⚠️ Failed to load API key: " + e);
        }
    }

    function updateAiStatus(connected) {
        var statusEl = document.getElementById('aiStatus');
        if (connected) {
            statusEl.textContent = "🟢 Mistral AI connected (key stored in session)";
            statusEl.className = "ai-status connected";
        } else {
            statusEl.textContent = "🔴 Mistral AI disconnected (no key)";
            statusEl.className = "ai-status disconnected";
        }
    }

    async function testAiConnection() {
        if (!mistralApiKey) {
            gLog("⚠️ No API key configured");
            return;
        }
        
        aiBusy = true;
        gLog("🔍 Testing Mistral AI connection...");
        
        try {
            const response = await callMistralAPI("Say 'test successful'");
            if (response && response.choices && response.choices[0]) {
                gLog("✅ Mistral AI connection test passed!");
            } else {
                gLog("❌ Mistral AI connection test failed: Invalid response format");
            }
        } catch(error) {
            gLog("❌ Mistral AI connection test failed: " + error.message);
        } finally {
            aiBusy = false;
        }
    }

    // ---------- MISTRAL API CALL ----------
    async function callMistralAPI(prompt) {
        if (!mistralApiKey) {
            throw new Error("Mistral API key not configured");
        }
        
        const url = 'https://api.mistral.ai/v1/chat/completions';
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${mistralApiKey}`
        };
        
        const body = JSON.stringify({
            model: 'mistral-large-latest',
            messages: [
                {
                    role: 'user',
                    content: prompt
                }
            ],
            temperature: 0.7,
            max_tokens: 1000
        });
        
        const response = await fetch(url, {
            method: 'POST',
            headers: headers,
            body: body
        });
        
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(`API error: ${response.status} ${response.statusText}` + 
                           (errorData.message ? ' - ' + errorData.message : ''));
        }
        
        return await response.json();
    }

    // ---------- AI PROMPT HANDLING ----------
    async function handleAiPrompt(room, sender, text, messageId, connection) {
        if (!mistralApiKey) {
            roomLog(room, "⚠️ AI not configured - no API key");
            return;
        }
        
        if (aiBusy) {
            roomLog(room, "⏳ AI is busy processing another request");
            return;
        }

        // Extract last 5 lines from the terminal
        const term = document.getElementById(`term-${room}`);
        const context = term
            ? Array.from(term.querySelectorAll('.chat-line'))
              .slice(-10)
              .map(line => line.textContent)
              .join('\n')
        : 'No context';
        
        // Extract the prompt after @ai
        const promptMatch = text.match(/@ai\s+(.+)/i);
        if (!promptMatch) return;
        
        const prompt = "You are a bot called @markovbot (-extendedLLM) in euphoria.leet.nu/room/" + room + " a chat room on This prompt given by user @" + sender + " in useing the '@ai prompt' comand. Answer in less than 50 words with no emoji or markdown unless absolutely necessary. Plain text reply only. Here is room logs \"" + context + "\" Prompt is: " + promptMatch[1].trim();
        if (!prompt) return;
        
        roomLog(room, `🤖 AI request from ${sender}: ${prompt}`);
        aiBusy = true;
        
        try {
            // Show thinking indicator
            const thinkingId = Date.now();
            roomLog(room, `<span class="ai-thinking" id="thinking-${thinkingId}">AI is thinking...</span>`);
            
            const response = await callMistralAPI(prompt);
            
            if (response && response.choices && response.choices[0] && response.choices[0].message) {
                const aiResponse = response.choices[0].message.content;
                
                // Remove thinking indicator
                const thinkingEl = document.getElementById(`thinking-${thinkingId}`);
                if (thinkingEl) thinkingEl.remove();
                
                // Send AI response to the room
                connection.send(JSON.stringify({
                    type: 'send',
                    data: {
                        content: `🤖 ${aiResponse}`,
                        parent: messageId
                    }
                }));
                
                roomLog(room, `🤖 AI Response: ${aiResponse.substring(0, 100)}${aiResponse.length > 100 ? '...' : ''}`);
            } else {
                roomLog(room, "❌ AI returned an invalid response format");
            }
        } catch(error) {
            roomLog(room, `❌ AI Error: ${error.message}`);
        } finally {
            aiBusy = false;
        }
    }

    // ---------- NOTIFY LOCALSTORAGE ----------
    function loadUsername() {
        try {
            var keys = ['markov_username', 'markov_name', 'markov_nick'];
            for (var i=0;i<keys.length;i++){
                var k = keys[i];
                var v = localStorage.getItem(k);
                if (v) {
                    currentUserName = v;
                    break;
                }
            }
            var explicit = localStorage.getItem('markov_username');
            if (explicit) currentUserName = explicit;
            document.getElementById('notifyUsername').value = currentUserName === BOT_NAME ? '' : currentUserName;

            var auto = localStorage.getItem('markov_notify_autoscroll');
            if (auto !== null) notifyAutoScroll = (auto === 'true');
            document.getElementById('notifyAutoScroll').checked = notifyAutoScroll;

            var en = localStorage.getItem('markov_notify_enable');
            if (en !== null) notifyEnabled = (en === 'true');
            document.getElementById('notifyEnable').checked = notifyEnabled;
        } catch(e) {
            gLog('⚠️ Failed to load username/notify prefs: ' + e);
        }
    }

    function saveUsername() {
        try {
            var v = document.getElementById('notifyUsername').value.trim();
            if (v.length === 0) {
                currentUserName = BOT_NAME;
                localStorage.removeItem('markov_username');
            } else {
                currentUserName = v;
                localStorage.setItem('markov_username', currentUserName);
            }
            gLog('Saved reply username: ' + currentUserName);
        } catch(e) {
            gLog('⚠️ Failed to save username: ' + e);
        }
    }

    function saveNotifyPrefs() {
        try {
            localStorage.setItem('markov_notify_autoscroll', notifyAutoScroll ? 'true' : 'false');
            localStorage.setItem('markov_notify_enable', notifyEnabled ? 'true' : 'false');
        } catch(e) {
            gLog('⚠️ Failed to save notify prefs: ' + e);
        }
    }

    function gLog(msg) {
        var entry = document.createElement('div');
        entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        document.getElementById('globalLog').appendChild(entry);
        document.getElementById('globalLog').scrollTop = document.getElementById('globalLog').scrollHeight;
    }

    function roomLog(roomName, msg) {
        var term = document.getElementById('term-' + roomName);
        if (term) {
            var entry = document.createElement('div');
            entry.className = 'chat-line';
            entry.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            term.appendChild(entry);
            term.scrollTop = term.scrollHeight;
        }
    }

    // ---------- N-GRAM (1-4) WITH DUMB BACKOFF ----------
    function train(text) {
        if (!text) return;
        var words = text.toLowerCase().trim().split(/\s+/);
        words.push(".");
        if (words.length < 2) return;

        for (var n = 1; n <= 4; n++) {
            for (var i = 0; i <= words.length - n - 1; i++) {
                var key = words.slice(i, i + n).join(' ');
                var next = words[i + n];
                if (!brain[n][key]) brain[n][key] = [];
                brain[n][key].push(next);
            }
        }
        saveBrain();
    }

    function generate(seedText) {
        var seedWords = seedText.toLowerCase().trim().split(/\s+/);
        if (seedWords.length === 0) return "give me some words to start with.";

        var result = seedWords.slice();
        for (var i = 0; i < 50; i++) {
            var found = false;
            var maxN = Math.min(4, result.length);
            for (var n = maxN; n >= 1; n--) {
                var key = result.slice(result.length - n).join(' ');
                if (brain[n][key] && brain[n][key].length > 0) {
                    var options = brain[n][key];
                    var next = options[Math.floor(Math.random() * options.length)];
                    if (next === ".") {
                        return result.join(' ');
                    }
                    result.push(next);
                    found = true;
                    break;
                }
            }
            if (!found) break;
        }
        return result.join(' ');
    }

    // ---------- ROOM TERMINAL MANAGEMENT ----------
    function switchTab(roomName) {
        activeTab = roomName;
        var buttons = document.getElementsByClassName('tab-btn');
        for (var i=0; i<buttons.length; i++) buttons[i].classList.remove('active');
        var btn = document.getElementById('btn-' + roomName);
        if (btn) btn.classList.add('active');
        else if (roomName === 'notify') document.getElementById('btn-notify').classList.add('active');

        var contents = document.getElementsByClassName('tab-content');
        for (var i=0; i<contents.length; i++) contents[i].style.display = 'none';
        var t = document.getElementById('term-' + roomName);
        if (t) t.style.display = 'block';
        if (roomName === 'notify') document.getElementById('term-notify').style.display = 'block';
    }

    function removeRoom(roomName) {
        if (connections[roomName]) {
            connections[roomName].manualClose = true;
            connections[roomName].close();
            delete connections[roomName];
        }
        var btn = document.getElementById('btn-' + roomName);
        if (btn) btn.remove();
        var term = document.getElementById('term-' + roomName);
        if (term) term.remove();
        gLog("Closed terminal for &" + roomName);
        saveRooms();

        var remaining = Object.keys(connections);
        if (remaining.length > 0) switchTab(remaining[0]);
    }

    function addRoom(roomName) {
        var r = roomName || document.getElementById('newRoom').value.replace('&', '').trim();
        if (r && !connections[r]) {
            var btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.id = 'btn-' + r;
            btn.innerHTML = '&' + r + ' <span class="btn-red" onclick="removeRoom(\''+r+'\'); event.stopPropagation();">X</span>';
            btn.onclick = function() { switchTab(r); };
            document.getElementById('tabBar').appendChild(btn);

            var term = document.createElement('div');
            term.className = 'tab-content';
            term.id = 'term-' + r;
            term.style.display = 'none';
            document.getElementById('terminalContainer').appendChild(term);

            connectToRoom(r);
            switchTab(r);
            if (!roomName) document.getElementById('newRoom').value = "";
            saveRooms();
        }
    }

    // ---------- WEBSOCKET CONNECTION ----------
    function connectToRoom(roomName) {
        var ws = new WebSocket('wss://euphoria.leet.nu/room/' + roomName + '/ws');
        ws.manualClose = false;
        var ready = false;

        ws.onopen = function() {
            gLog("Successfully connected to &" + roomName);
            roomLog(roomName, "--- TERMINAL OPENED: BOT ONLINE ---");
            ws.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
        };

        ws.onmessage = function(e) {
            var packet = JSON.parse(e.data);
            
            if (packet.type === 'ping-event') {
                ws.send(JSON.stringify({ type: 'ping-reply', data: { time: packet.data.time } }));
                return;
            }

            if (packet.type === 'snapshot-event') {
                ready = true;
                roomLog(roomName, "--- Room snapshot received (bot ready) ---");
                return;
            }

            if (packet.type === 'bounce-event') {
                roomLog(roomName, "⚠️ Room requires authentication – use auth/login command.");
                return;
            }

            if (packet.type === 'send-event') {
                var data = packet.data;
                var text = data.content;
                var sender = data.sender.name.toLowerCase();
                
                try {
                    if (text && sender !== BOT_NAME) {
                        addMessageToNotifyList(roomName, data.sender.name, text, data.id);
                    }
                } catch(err) { /* non-fatal */ }

                if (sender === BOT_NAME) return;

                var lowerText = text.toLowerCase();
                var isMentioned = (lowerText.indexOf('@' + BOT_NAME) !== -1);

                // Check for @ai command
                if (lowerText.includes('@ai')) {
                    handleAiPrompt(roomName, data.sender.name, text, data.id, ws);
                }

                // Train on every message except !markov commands
                if (lowerText.indexOf('!markov') !== 0) {
                    train(text);
                    roomLog(roomName, "Learned from " + sender + ": " + text);
                } else {
                    roomLog(roomName, sender + " used command: " + text);
                }

                if (!ready) {
                    roomLog(roomName, "⏳ Not ready yet – waiting for snapshot.");
                    return;
                }

                // Bot responses
                if (lowerText.includes("!help @markovbot")) {
                    ws.send(JSON.stringify({ type: 'send', data: { content: "markovbot, a markov chain bot, n-gram (1-4) | maker: @peterforever + vibe coded with: gemini/deepseek/mistral | !help, !ping, !markov, @ai [prompt]", parent: data.id }}));
                }
                else if (lowerText === '!ping' || (isMentioned && lowerText.indexOf('!ping') !== -1)) {
                    ws.send(JSON.stringify({ type: 'send', data: { content: "pong! 🏓", parent: data.id }}));
                }
                else if (lowerText.indexOf('!markov') === 0) {
                    var seed = lowerText.replace('!markov', '').replace('@' + BOT_NAME, '').trim();
                    var reply = generate(seed);
                    ws.send(JSON.stringify({ type: 'send', data: { content: reply, parent: data.id }}));
                    roomLog(roomName, "REPLIED: " + reply);
                }
            }
        };

        ws.onclose = function() {
            if (!ws.manualClose) {
                gLog("Connection lost for &" + roomName + ". Retrying in 5s...");
                setTimeout(function() { connectToRoom(roomName); }, 5000);
            }
        };

        connections[roomName] = ws;
    }

    // ---------- NOTIFY LIST MANAGEMENT ----------
    function addMessageToNotifyList(room, sender, text, id) {
        if (!notifyEnabled) return;
        var ts = Date.now();
        recentMessages.unshift({room: room, sender: sender, text: text, id: id, ts: ts});
        if (recentMessages.length > maxMessages) recentMessages.pop();
        renderNotifyList();
    }

    function renderNotifyList(options) {
        options = options || {};
        var el = document.getElementById('notifyList');
        el.innerHTML = '';
        recentMessages.forEach(function(m, idx) {
            var item = document.createElement('div');
            item.className = 'notify-item' + (selectedMessage && selectedMessage.idx === idx ? ' selected' : '');
            item.onclick = function() { selectMessage(idx); };
            item.innerHTML = '<div><strong>&' + m.room + '</strong> <span class="notify-meta">' + m.sender + ' • ' + new Date(m.ts).toLocaleTimeString() + '</span></div><div>' + escapeHtml(m.text) + '</div>';
            el.appendChild(item);
        });
        if (notifyAutoScroll && !options.noScroll) el.scrollTop = el.scrollHeight;
    }

    function selectMessage(idx) {
        selectedMessage = Object.assign({ idx: idx }, recentMessages[idx]);
        document.getElementById('notifySelected').textContent = '&' + selectedMessage.room + ' / ' + selectedMessage.sender;
        document.getElementById('notifyReplyText').value = '';
        renderNotifyList({ noScroll: true });
    }

    function clearNotifyList() {
        recentMessages = [];
        selectedMessage = null;
        document.getElementById('notifySelected').textContent = '(none)';
        renderNotifyList();
    }

    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function sendInlineReply() {
        if (!selectedMessage) { alert('Select a message first from the list.'); return; }
        var text = document.getElementById('notifyReplyText').value.trim();
        if (!text) { alert('Write a message to send.'); return; }
        var room = selectedMessage.room;
        var conn = connections[room];
        if (!conn || conn.readyState !== WebSocket.OPEN) { alert('Connection for &' + room + ' is not open.'); return; }

        var usr = document.getElementById('notifyUsername').value.trim();
        if (!usr) usr = BOT_NAME;

        try {
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: usr } }));
            conn.send(JSON.stringify({ type: 'send', data: { content: text, parent: selectedMessage.id }}));
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
            gLog('Sent inline reply to &' + room + ' as ' + usr + ': ' + text);

            recentMessages.unshift({ room: room, sender: usr, text: text, id: 'local-' + Date.now(), ts: Date.now() });
            if (recentMessages.length > maxMessages) recentMessages.pop();
            document.getElementById('notifyReplyText').value = '';
            renderNotifyList();
        } catch(e) {
            gLog('⚠️ Failed to send inline reply: ' + e);
        }
    }

    function sendNonInlineReply() {
        if (!selectedMessage) { alert('Select a message first from the list.'); return; }
        var text = document.getElementById('notifyReplyText').value.trim();
        if (!text) { alert('Write a message to send.'); return; }
        var room = selectedMessage.room;
        var conn = connections[room];
        if (!conn || conn.readyState !== WebSocket.OPEN) { alert('Connection for &' + room + ' is not open.'); return; }

        var usr = document.getElementById('notifyUsername').value.trim();
        if (!usr) usr = BOT_NAME;

        try {
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: usr } }));
            conn.send(JSON.stringify({ type: 'send', data: { content: text }}));
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
            gLog('Sent separate reply to &' + room + ' as ' + usr + ': ' + text);

            recentMessages.unshift({ room: room, sender: usr, text: text, id: 'local-' + Date.now(), ts: Date.now() });
            if (recentMessages.length > maxMessages) recentMessages.pop();
            document.getElementById('notifyReplyText').value = '';
            renderNotifyList();
        } catch(e) {
            gLog('⚠️ Failed to send separate reply: ' + e);
        }
    }

    function sendToNullThread() {
        var room = document.getElementById('nullRoom').value.replace('&','').trim();
        if (!room) { alert('Enter a room to send to.'); return; }
        var text = document.getElementById('notifyReplyText').value.trim();
        if (!text) { alert('Write a message to send.'); return; }
        var conn = connections[room];
        if (!conn || conn.readyState !== WebSocket.OPEN) { alert('Connection for &' + room + ' is not open.'); return; }

        var usr = document.getElementById('notifyUsername').value.trim();
        if (!usr) usr = BOT_NAME;

        try {
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: usr } }));
            conn.send(JSON.stringify({ type: 'send', data: { content: text }}));
            if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
            gLog('Sent null-thread message to &' + room + ' as ' + usr + ': ' + text);

            recentMessages.unshift({ room: room, sender: usr, text: text, id: 'local-' + Date.now(), ts: Date.now() });
            if (recentMessages.length > maxMessages) recentMessages.pop();
            document.getElementById('notifyReplyText').value = '';
            renderNotifyList();
        } catch(e) {
            gLog('⚠️ Failed to send null-thread message: ' + e);
        }
    }

    // ---------- BRAIN MANAGEMENT ----------
    function exportBrain() {
        document.getElementById('brainText').value = JSON.stringify(brain);
    }

    function importBrain() {
        try {
            brain = JSON.parse(document.getElementById('brainText').value);
            saveBrain();
            gLog("🧠 Brain updated and saved to localStorage.");
        } catch(e) {
            alert("Invalid JSON!");
        }
    }

    // ---------- INITIALIZATION ----------
    loadBrain();
    loadUsername();
    loadApiKey();

    document.addEventListener('DOMContentLoaded', function() {
        var en = document.getElementById('notifyEnable');
        var auto = document.getElementById('notifyAutoScroll');
        en.checked = notifyEnabled;
        auto.checked = notifyAutoScroll;
        en.onchange = function() { notifyEnabled = en.checked; saveNotifyPrefs(); };
        auto.onchange = function() { notifyAutoScroll = auto.checked; saveNotifyPrefs(); };
        document.getElementById('notifyUsername').onchange = function() { /* lazy */ };
    });

    var savedRooms = localStorage.getItem('markov_rooms');
    if (savedRooms) {
        loadRooms();
    }

    if (Object.keys(connections).length === 0) {
        addRoom('test');
    }
</script>
