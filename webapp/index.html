<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MarkovBot Multi-Terminal Manager + AI</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a1a; 
            color: #dcdcdc; 
            padding: 15px; 
            font-size: 13px; 
            margin: 0; 
        }
        .container { max-width: 1000px; margin: auto; }
        #globalLog { 
            background: #000; 
            border: 1px solid #444; 
            height: 120px; 
            overflow-y: scroll; 
            padding: 8px; 
            font-family: monospace; 
            font-size: 11px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
            color:#dcdcdc 
        }
        .controls { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            margin-bottom: 10px; 
        }
        .tabs { 
            display: flex; 
            overflow-x: auto; 
            background: #333; 
            border-radius: 5px 5px 0 0; 
            border: 1px solid #444; 
            border-bottom: none; 
        }
        .tab-btn { 
            padding: 10px 20px; 
            background: none; 
            border: none; 
            color: #fff; 
            cursor: pointer; 
            border-right: 1px solid #444; 
        }
        .tab-btn.active { 
            background: #444; 
            color: #00ff00; 
            font-weight: bold; 
        }
        .tab-content { 
            background: #000; 
            border: 1px solid #444; 
            height: 350px; 
            overflow-y: scroll; 
            padding: 10px; 
            font-family: monospace; 
            border-radius: 0 0 5px 5px; 
            color: #00ff00; 
        }
        input, textarea { 
            width: 100%; 
            background: #000; 
            color: #00ff00; 
            border: 1px solid #555; 
            padding: 8px; 
            margin: 5px 0; 
            box-sizing: border-box; 
        }
        button { 
            background: #0066cc; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        button:disabled { 
            background: #555; 
            cursor: not-allowed; 
        }
        .btn-red { 
            background: #cc0000; 
            margin-left: 10px; 
            padding: 4px 8px; 
            font-size: 10px; 
        }
        .maker-tag { 
            font-size: 11px; 
            color: #777; 
            text-align: center; 
            display: block; 
            margin-top: 20px; 
            font-style: italic; 
        }
        .chat-line { 
            margin-bottom: 4px; 
            border-bottom: 1px solid #111; 
        }
        .ai-controls { 
            background: #1e1e1e; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            margin-bottom: 10px; 
        }
        .ai-status { 
            font-size: 11px; 
            color: #aaa; 
            margin-top: 5px; 
        }
        .ai-status.connected { color: #00ff00; }
        .ai-status.disconnected { color: #ff5555; }
        .notify-controls { 
            padding: 10px; 
            border-bottom: 1px solid #333; 
            display:flex; 
            gap:8px; 
            align-items:center; 
        }
        .notify-list { 
            height: 200px; 
            overflow-y: auto; 
            background: #0b0b0b; 
            border-top: 1px solid #222; 
            padding: 8px; 
            font-family: monospace; 
            font-size: 12px; 
        }
        .notify-item { 
            padding: 6px; 
            border-bottom: 1px solid #111; 
            cursor: pointer; 
        }
        .notify-item.selected { 
            background: rgba(0,255,0,0.06); 
        }
        .notify-meta { 
            color: #999; 
            font-size: 11px; 
        }
        .notify-reply { margin-top: 8px; }
        .small { font-size: 11px; padding: 6px; }
        .big { padding: 12px 18px; font-size: 14px; }
        .ai-response { 
            border-left: 3px solid #0066cc; 
            padding-left: 10px; 
            margin: 8px 0; 
            background: rgba(0,102,204,0.05); 
        }
        .ai-thinking { 
            color: #aaa; 
            font-style: italic; 
        }
        .search-controls { 
            padding: 10px; 
            border-bottom: 1px solid #333; 
            display:flex; 
            gap:8px; 
            align-items:center; 
        }
        .search-list { 
            height: 200px; 
            overflow-y: auto; 
            background: #0b0b0b; 
            border-top: 1px solid #222; 
            padding: 8px; 
            font-family: monospace; 
            font-size: 12px; 
        }
        .search-item { 
            padding: 6px; 
            border-bottom: 1px solid #111; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .search-item.selected { 
            background: rgba(0,255,0,0.06); 
        }
        .search-meta { 
            color: #999; 
            font-size: 11px; 
        }
        .search-text { flex: 1; }
        .delete-btn { 
            background: #cc0000; 
            color: white; 
            border: none; 
            padding: 2px 6px; 
            cursor: pointer; 
            font-size: 10px; 
            border-radius: 3px; 
        }
        .search-results-info { 
            color: #aaa; 
            font-size: 11px; 
            margin-bottom: 5px; 
        }
        #fileProtocolWarning {
            background: #ff5555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="fileProtocolWarning" style="display: none;">
            ⚠️ WARNING: This app requires a web server. Open via HTTP/HTTPS (not file://) for full functionality.
        </div>
        <h3>🌐 Global Connection Log</h3>
        <div id="globalLog"></div>
        <div class="ai-controls">
            <strong>🤖 Mistral AI Configuration</strong>
            <div style="display: flex; gap: 5px; margin-top: 8px;">
                <button onclick="testAiConnection()">Test Connection</button>
            </div>
            <div id="aiStatus" class="ai-status">API key not configured</div>
        </div>
        <div class="controls">
            <strong>🔍 Chat Search & Records</strong>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Search previous chats..." style="flex: 1;">
                <button onclick="performSearch()">Search</button>
                <button onclick="clearSearch()" class="btn-red">Clear</button>
            </div>
            <div id="searchResultsInfo" class="search-results-info"></div>
            <div id="searchResults" class="search-list"></div>
        </div>
        <div class="controls">
            <div style="display:flex; gap: 5px;">
                <input type="text" id="newRoom" placeholder="Enter room name (e.g. test)">
                <button onclick="addRoom()">Connect & Open Terminal</button>
            </div>
        </div>
        <div class="tabs" id="tabBar">
            <button class="tab-btn" id="btn-notify" onclick="switchTab('notify')">💬 Direct Chat</button>
        </div>
        <div id="terminalContainer">
            <div class="tab-content" id="term-notify" style="display:none;">
                <div class="notify-controls">
                    <label><input type="checkbox" id="notifyEnable" onchange="saveNotifyPrefs()"> Enable</label>
                    <label style="margin-left:8px;"><input type="checkbox" id="notifyAutoScroll" onchange="saveNotifyPrefs()"> Auto-scroll</label>
                    <input type="text" id="notifyUsername" placeholder="Reply username" style="flex:1; max-width:220px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                    <button class="small" onclick="saveUsername()">Save</button>
                </div>
                <div id="notifyList" class="notify-list"></div>
                <div class="notify-reply">
                    <div class="notify-meta">Selected: <span id="notifySelected">(none)</span></div>
                    <textarea id="notifyReplyText" rows="3" placeholder="Write your reply here..."></textarea>
                    <div style="display:flex; gap:8px; margin-top:6px;">
                        <button onclick="sendInlineReply()">Send Reply</button>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
                        <input id="nullRoom" placeholder="room for null thread (e.g. test)" style="flex:1; max-width:300px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                        <button class="big" onclick="sendToNullThread()">SEND TO NULL THREAD</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls" style="margin-top:20px;">
            <strong>📜 Log Management (Text-Based JSON):</strong>
            <textarea id="logsText" rows="2"></textarea>
            <button onclick="exportLogs()">Show Current Logs</button>
            <button onclick="importLogs()">Apply Text to Logs</button>
        </div>
        <span class="maker-tag">Maker: peterforever + gemini + mistral</span>
    </div>
    <script src="webllm-ai.js"></script>
    <script>
        // === GLOBAL STATE ===
        var brain = { 1: {}, 2: {}, 3: {}, 4: {} };
        var connections = {};
        var BOT_NAME = 'markovbot';
        var activeTab = null;
        var mistralApiKey = null;
        var notifyEnabled = false;
        var notifyAutoScroll = true;
        var recentMessages = [];
        var maxMessages = 200;
        var selectedMessage = null;
        var currentUserName = BOT_NAME;
        var aiBusy = false;
        var chatRecords = {};
        var isFileProtocol = window.location.protocol === 'file:';

        // === INITIALIZATION ===
        function initializeBrain() {
            // Ensure brain has the correct structure
            brain = { 1: {}, 2: {}, 3: {}, 4: {} };
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (isFileProtocol) {
                document.getElementById('fileProtocolWarning').style.display = 'block';
                gLog("⚠️ Running in file:// mode. WebSocket and localStorage will NOT work. Use a web server!");
            }
            initializeBrain();
            loadBrain();
            loadRooms();
            loadChatRecords();
            loadApiKey();
            loadUsername();
            loadNotifyPrefs();
            gLog("✅ App initialized. Brain, rooms, and chat records loaded.");
        });

        // === LOCALSTORAGE PERSISTENCE ===
        function saveBrain() {
            if (isFileProtocol) return;
            try {
                localStorage.setItem('markov_brain', JSON.stringify(brain));
                gLog("🧠 Brain saved to local storage.");
            } catch(e) {
                gLog("⚠️ Failed to save brain: " + e.message);
            }
        }

        function loadBrain() {
            if (isFileProtocol) return;
            try {
                var data = localStorage.getItem('markov_brain');
                if (data) {
                    var loadedBrain = JSON.parse(data);
                    // Validate and merge with default structure
                    for (var n = 1; n <= 4; n++) {
                        if (!loadedBrain[n]) {
                            loadedBrain[n] = {};
                        }
                    }
                    brain = loadedBrain;
                    gLog("🧠 Brain loaded from local storage.");
                } else {
                    gLog("🧠 No existing brain found. Starting fresh.");
                }
            } catch(e) {
                gLog("⚠️ Failed to load brain: " + e.message);
                initializeBrain(); // Reset to default if loading fails
            }
        }

        function saveRooms() {
            if (isFileProtocol) return;
            try {
                var rooms = Object.keys(connections);
                localStorage.setItem('markov_rooms', JSON.stringify(rooms));
            } catch(e) {
                gLog("⚠️ Failed to save rooms: " + e.message);
            }
        }

        function loadRooms() {
            if (isFileProtocol) return;
            try {
                var data = localStorage.getItem('markov_rooms');
                if (data) {
                    var rooms = JSON.parse(data);
                    rooms.forEach(function(room) {
                        if (!connections[room]) {
                            addRoom(room);
                        }
                    });
                }
            } catch(e) {
                gLog("⚠️ Failed to load rooms: " + e.message);
            }
        }

        // === CHAT RECORDS PERSISTENCE ===
        function saveChatRecords() {
            if (isFileProtocol) return;
            try {
                localStorage.setItem('markov_chat_records', JSON.stringify(chatRecords));
            } catch(e) {
                gLog("⚠️ Failed to save chat records: " + e.message);
            }
        }

        function loadChatRecords() {
            if (isFileProtocol) return;
            try {
                var data = localStorage.getItem('markov_chat_records');
                if (data) {
                    chatRecords = JSON.parse(data);
                    gLog("📝 Chat records loaded from local storage.");
                }
            } catch(e) {
                gLog("⚠️ Failed to load chat records: " + e.message);
            }
        }

        function addToChatRecords(room, sender, text, messageId) {
            if (!chatRecords[room]) {
                chatRecords[room] = [];
            }
            deleteChatRecordByText(room, text);
            chatRecords[room].unshift({
                id: messageId || 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                sender: sender,
                text: text,
                timestamp: Date.now(),
                room: room
            });
            saveChatRecords();
        }

        function deleteChatRecord(room, messageId) {
            if (chatRecords[room]) {
                chatRecords[room] = chatRecords[room].filter(function(msg) {
                    return msg.id !== messageId;
                });
                saveChatRecords();
                performSearch();
            }
        }

        function deleteChatRecordByText(room, messageTxt) {
            if (chatRecords[room]) {
                chatRecords[room] = chatRecords[room].filter(function(msg) {
                    return msg.text !== messageTxt;
                });
                saveChatRecords();
                performSearch();
            }
        }

        // === SEARCH FUNCTIONALITY ===
        function searchChatRecords(query) {
            var results = [];
            var lowerQuery = query.toLowerCase();
            for (var room in chatRecords) {
                chatRecords[room].forEach(function(msg) {
                    if (msg.text.toLowerCase().includes(lowerQuery)) {
                        results.push({
                            room: room,
                            sender: msg.sender,
                            text: msg.text,
                            id: msg.id,
                            timestamp: msg.timestamp
                        });
                    }
                });
            }
            .sort(function(a, b) { return b.timestamp - a.timestamp; });
            return results;
        }

        function performSearch() {
            var query = document.getElementById('searchInput').value.trim();
            var resultsContainer = document.getElementById('searchResults');
            var resultsInfo = document.getElementById('searchResultsInfo');
            if (!query) {
                resultsContainer.innerHTML = '';
                resultsInfo.textContent = '';
                return;
            }
            var results = searchChatRecords(query);
            resultsInfo.textContent = `Found ${results.length} results for "${query}"`;
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="search-item"><span class="search-text">No results found</span></div>';
                return;
            }
            resultsContainer.innerHTML = '';
            results.forEach(function(result) {
                var item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                    <div style="display: flex; flex-direction: column;">
                        <div class="search-meta">[&${result.room}] ${result.sender} • ${new Date(result.timestamp).toLocaleTimeString()}</div>
                        <div class="search-text">${escapeHtml(result.text)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteChatRecord('${result.room}', '${result.id}'); event.stopPropagation();">Delete</button>
                `;
                resultsContainer.appendChild(item);
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchResultsInfo').textContent = '';
        }

        async function testAiConnection() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot test API in file:// mode.");
                return;
            }
            aiBusy = true;
            gLog("🔍 Testing Mistral AI connection...");
            try {
                const response = await callAI("", "Say 'test successful'");
                if (response && response.choices && response.choices[0]) {
                    gLog("✅ Mistral AI connection test passed!");
                } else {
                    gLog("❌ Mistral AI connection test failed: Invalid response format");
                }
            } catch(error) {
                gLog("❌ Mistral AI connection test failed: " + error.message);
            } finally {
                aiBusy = false;
            }
        }

        async function callMistralAPI(sys, prompt) {
            callAI(sys,prompt);
        }

        // === AI PROMPT HANDLING ===
        async function handleAiPrompt(room, sender, text, messageId, connection) {
            //if (aiBusy) {
            //    roomLog(room, "AI is busy processing another request");
            //    return;
            //} <- USELESS FOR NOW....
            const term = document.getElementById(`term-${room}`);
            const context = term
                ? Array.from(term.querySelectorAll('.chat-line'))
                  .slice(-30)
                  .map(line => line.textContent)
                  .join('\n')
            : 'No context';
            const sys = `
You are the AI chatbot component of @markovbot, a smart AI for Euphoria (a chat-room system).
Maker: @peterforever + vibe.
Coded with: Gemini / DeepSeek / Mistral.

Available commands:
• !help
• !ping
• !markov [seed]
• @ai [prompt]
• !search [phrase]

You can also use commands like "!tell @name something" to send a message via @TellBot.

You are currently in the "${room}" room on Euphoria.
This prompt was given by user @${sender} using the "@ai" command.

Rules:
- Answer simply in 20 words or more if necessary.
- Plain text only.
- Here are the room logs: "${context}".

ALWAYS respond with a JSON array of strings, e.g.:
["response", "command 1"]

Special self-call mechanism:
If yoh already used a command and want to read return to do more commands (or just summarize), use the command "!selfcall <prompt>" to trigger a self-call in 10 seconds.
This lets you read the return value of commands you issued and spawn "sub agents".
You can then read the message from the bot you interacted with, run further commands, and self-call again if needed.

Important guidelines:
- Do NOT write !selfcall if there is no need to wait for more data from the command you used in the current reply array.
- If you need to run a command, just put it in the array.
- Do NOT repeatedly run the same command.
- DO NOT use !selfcall command if you did not already used a command in the array.
- ALWAYS use the !selfcall command with clear targets if you need to read the return of your previous command.
- ALWAYS give a summary to the user at the end of what you found once you finish autonomous !selfcall loops.
- You can however, do plenty of !selfcall if you have a complex agentic task that requires many commands to other bots.
Other commands (like !tell) can be used the same way. Example:
[
  "Im going to run !tell command",
  "!tell @markovbot this message gets relayed to me!",
  "!selfcall check if @TellBot replied and summarize to user without using the !selfcall command"
]

SIMPLY DON'T USE !selfcall IF THERE IS NO REPLY TO COMMAND TO BE READ, just directly give the summary in the last value of the arrays.

Use "!help" or "!ping" to discover other bots.

Do not use !selfcall to verify when there are no commands used. Just finish without any !selfcall command, for example ["1+1=?, hmm it is 2","The answer is 2."] .
Do not selfcall to check if you want to wait for user's reply or scan for more context b/c there is none to be gained. DO NOT use it to wait for further prompts, tell user to just use @ai <prompt/reply to ai> and end the reply there.

Remember to *always* reply using direct JSON arrays in strings.
DO NOT USE \`\`\` code blocks
`;
            const prompt = text.trim();
            if (!prompt) return;
            roomLog(room, `@${sender} prompted: ${text}`);
            aiBusy = true;
            try {
                const response = await callMistralAPI(sys, prompt);
                if (response && response.choices && response.choices[0]?.message?.content) {
                    const aiResponse = response.choices[0].message.content.trim();
                    try {
                        const replies = JSON.parse(aiResponse);
                        connection.send(JSON.stringify({ type: 'nick', data: { name: 'markovbot(AI)' } }));
                        if (Array.isArray(replies)) {
                            replies.forEach((reply, index) => {
                                const selfCallMatch = reply.match(/^!selfcall\s*(.*)$/i);
                                if (selfCallMatch) {
                                    const selfPrompt = + selfCallMatch[1].trim() || text;
                                
                                    setTimeout(() => {
                                        roomLog(room, `Self-call scheduled after 50s: ${selfPrompt.substring(0, 50)}...`);
                                        handleAiPrompt(room, "AI self callback", `@ai ${selfPrompt}`, messageId , connection)
                                            .catch(e => roomLog(room, `Scheduled AI call failed: ${e.message}`));
                                    }, 10000);
                                }
                                
                                if (connection.readyState === WebSocket.OPEN) {
                                    connection.send(JSON.stringify({
                                        type: 'send',
                                        data: { content: reply, parent: messageId }
                                    }));
                                }
                            });
                        } else {
                            if (connection.readyState === WebSocket.OPEN) {
                                connection.send(JSON.stringify({
                                    type: 'send',
                                    data: { content: aiResponse, parent: messageId }
                                }));
                            }
                        }
                        if (connection.readyState === WebSocket.OPEN) {
                            connection.send(JSON.stringify({
                                type: 'send',
                                data: { content: `content gen. by ai in mistral-ai's servers`, parent: messageId }
                            }));
                            connection.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                        }
                        roomLog(room, `AI: ${aiResponse.substring(0, 1000)}${aiResponse.length > 1000 ? '...' : ''}`);
                        train(aiResponse);
                    } catch(error) {
                        roomLog(room, `AI Error: ${error.message}`);
                        if (connection.readyState === WebSocket.OPEN) {
                            connection.send(JSON.stringify({
                                type: 'send',
                                data: { content: "Error?: " + error.message + " meanwhile, markov chain says: " + generate(text), parent: messageId }
                            }));
                            connection.send(JSON.stringify({
                                type: 'send',
                                data: { content: "Ai Response (unformated):" + aiResponse, parent: messageId }
                            }));
                        }
                        roomLog(room, `AI Response (unformated): ${aiResponse}`);
                        
                    }
                }
            } catch(error) {
                roomLog(room, `AI Error: ${error.message}`);
            } finally {
                connection.send(JSON.stringify({ type: 'nick', data: { name: "markovbot" } }));
                aiBusy = false;
            }
        }

        function handleSearchCommand(room, sender, text, messageId, connection) {
            const searchMatch = text.match(/!search\s+(.+)/i);
            if (!searchMatch) return false;
            const query = searchMatch[1].trim();
            const results = searchChatRecords(query);
            if (results.length === 0) {
                if (connection.readyState === WebSocket.OPEN) {
                    connection.send(JSON.stringify({
                        type: 'send',
                        data: { content: `No results found for "${query}"`, parent: messageId }
                    }));
                }
            } else {
                const resultText = results.slice(0, 20).map(r => 
                    `[&${r.room}] ${r.sender}: ${r.text.substring(0, 100)}${r.text.length > 100 ? '...' : ''}`
                ).join(' \n| ');
                if (connection.readyState === WebSocket.OPEN) {
                    connection.send(JSON.stringify({
                        type: 'send',
                        data: { content: `Search results for "${query}": \n ${resultText}${results.length > 20 ? ` (+${results.length - 20} more)` : ''}`, parent: messageId }
                    }));
                }
            }
            return true;
        }

        // === NOTIFY LOCALSTORAGE ===
        function loadUsername() {
            if (isFileProtocol) return;
            try {
                var keys = ['markov_username', 'markov_name', 'markov_nick'];
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    var v = localStorage.getItem(k);
                    if (v) {
                        currentUserName = v;
                        break;
                    }
                }
                var explicit = localStorage.getItem('markov_username');
                if (explicit) currentUserName = explicit;
                document.getElementById('notifyUsername').value = currentUserName === BOT_NAME ? '' : currentUserName;
            } catch(e) {
                gLog('⚠️ Failed to load username: ' + e.message);
            }
        }

        function saveUsername() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot save username in file:// mode.");
                return;
            }
            try {
                var v = document.getElementById('notifyUsername').value.trim();
                if (v.length === 0) {
                    currentUserName = BOT_NAME;
                    localStorage.removeItem('markov_username');
                } else {
                    currentUserName = v;
                    localStorage.setItem('markov_username', currentUserName);
                }
                gLog('Saved reply username: ' + currentUserName);
            } catch(e) {
                gLog('⚠️ Failed to save username: ' + e.message);
            }
        }

        function loadNotifyPrefs() {
            if (isFileProtocol) return;
            try {
                var auto = localStorage.getItem('markov_notify_autoscroll');
                if (auto !== null) {
                    notifyAutoScroll = (auto === 'true');
                    document.getElementById('notifyAutoScroll').checked = notifyAutoScroll;
                }
                var en = localStorage.getItem('markov_notify_enable');
                if (en !== null) {
                    notifyEnabled = (en === 'true');
                    document.getElementById('notifyEnable').checked = notifyEnabled;
                }
            } catch(e) {
                gLog('⚠️ Failed to load notify prefs: ' + e.message);
            }
        }

        function saveNotifyPrefs() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot save notify prefs in file:// mode.");
                return;
            }
            try {
                notifyEnabled = document.getElementById('notifyEnable').checked;
                notifyAutoScroll = document.getElementById('notifyAutoScroll').checked;
                localStorage.setItem('markov_notify_autoscroll', notifyAutoScroll ? 'true' : 'false');
                localStorage.setItem('markov_notify_enable', notifyEnabled ? 'true' : 'false');
                gLog('Saved notify preferences.');
            } catch(e) {
                gLog('⚠️ Failed to save notify prefs: ' + e.message);
            }
        }

        // === LOGGING ===
        function gLog(msg) {
            var entry = document.createElement('div');
            entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            document.getElementById('globalLog').appendChild(entry);
            document.getElementById('globalLog').scrollTop = document.getElementById('globalLog').scrollHeight;
        }

        function roomLog(roomName, msg) {
            var term = document.getElementById('term-' + roomName);
            if (term) {
                var entry = document.createElement('div');
                entry.className = 'chat-line';
                entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
                term.appendChild(entry);
                term.scrollTop = term.scrollHeight;
            }
        }

        // === MARKOV CHAIN (FIXED) ===
        function train(text) {
            if (!text || typeof text !== 'string') return;
            
            // Ensure brain has the correct structure
            for (var n = 1; n <= 4; n++) {
                if (!brain[n]) {
                    brain[n] = {};
                }
            }
            
            var words = text.toLowerCase().trim().split(/\s+/);
            if (words.length === 0) return;
            words.push("."); // End marker
            
            for (var n = 1; n <= 4; n++) {
                for (var i = 0; i <= words.length - n - 1; i++) {
                    var key = words.slice(i, i + n).join(' ');
                    var next = words[i + n];
                    if (!brain[n][key]) {
                        brain[n][key] = [];
                    }
                    brain[n][key].push(next);
                }
            }
            saveBrain();
        }

        function generate(seedText) {
            if (Object.keys(chatRecords).length === 0) {
                loadChatRecords();
            }
            
            // Build a temporary brain from ALL chat records
            var tempBrain = { 1: {}, 2: {}, 3: {}, 4: {} };
            for (var room in chatRecords) {
                chatRecords[room].forEach(function(msg) {
                    if (msg.text && typeof msg.text === 'string') {
                        var text = msg.text.toLowerCase().trim();
                        if (text.length === 0) return;
                        var words = text.split(/\s+/);
                        words.push(".");
                        for (var n = 1; n <= 4; n++) {
                            for (var i = 0; i <= words.length - n - 1; i++) {
                                var key = words.slice(i, i + n).join(' ');
                                var next = words[i + n];
                                if (!tempBrain[n][key]) {
                                    tempBrain[n][key] = [];
                                }
                                tempBrain[n][key].push(next);
                            }
                        }
                    }
                });
            }

            var seedWords = seedText.toLowerCase().trim().split(/\s+/);
            if (seedWords.length === 0) {
                var allMessages = [];
                for (var room in chatRecords) {
                    allMessages = allMessages.concat(chatRecords[room]);
                }
                if (allMessages.length > 0) {
                    var randomMsg = allMessages[Math.floor(Math.random() * allMessages.length)];
                    seedWords = randomMsg.text.toLowerCase().trim().split(/\s+/).slice(0, 2);
                } else {
                    return "no messages to generate from.";
                }
            }

            var result = seedWords.slice();
            for (var i = 0; i < 50; i++) {
                var found = false;
                var maxN = Math.min(4, result.length);
                for (var n = maxN; n >= 1; n--) {
                    var key = result.slice(result.length - n).join(' ');
                    if (tempBrain[n][key] && tempBrain[n][key].length > 0) {
                        var options = tempBrain[n][key];
                        var next = options[Math.floor(Math.random() * options.length)];
                        if (next === ".") {
                            return result.join(' ');
                        }
                        result.push(next);
                        found = true;
                        break;
                    }
                }
                if (!found) break;
            }
            return result.join(' ');
        }

        // === ROOM TERMINAL MANAGEMENT ===
        function switchTab(roomName) {
            activeTab = roomName;
            var buttons = document.getElementsByClassName('tab-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            var btn = document.getElementById('btn-' + roomName);
            if (btn) {
                btn.classList.add('active');
            } else if (roomName === 'notify') {
                document.getElementById('btn-notify').classList.add('active');
            }
            var contents = document.getElementsByClassName('tab-content');
            for (var i = 0; i < contents.length; i++) {
                contents[i].style.display = 'none';
            }
            var t = document.getElementById('term-' + roomName);
            if (t) {
                t.style.display = 'block';
            }
            if (roomName === 'notify') {
                document.getElementById('term-notify').style.display = 'block';
            }
        }

        function removeRoom(roomName) {
            if (connections[roomName]) {
                connections[roomName].manualClose = true;
                connections[roomName].close();
                delete connections[roomName];
            }
            var btn = document.getElementById('btn-' + roomName);
            if (btn) btn.remove();
            var term = document.getElementById('term-' + roomName);
            if (term) term.remove();
            gLog("Closed terminal for &" + roomName);
            saveRooms();
            var remaining = Object.keys(connections);
            if (remaining.length > 0) {
                switchTab(remaining[0]);
            }
        }

        function addRoom(roomName) {
            var r = roomName || document.getElementById('newRoom').value.replace('&', '').trim();
            if (r && !connections[r]) {
                var btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.id = 'btn-' + r;
                btn.innerHTML = '&' + r + ' <span class="btn-red" onclick="removeRoom(\'' + r + '\'); event.stopPropagation();">X</span>';
                btn.onclick = function() { switchTab(r); };
                document.getElementById('tabBar').appendChild(btn);
                var term = document.createElement('div');
                term.className = 'tab-content';
                term.id = 'term-' + r;
                term.style.display = 'none';
                document.getElementById('terminalContainer').appendChild(term);
                connectToRoom(r);
                switchTab(r);
                if (!roomName) {
                    document.getElementById('newRoom').value = "";
                }
                saveRooms();
            }
        }

        // === WEBSOCKET CONNECTION ===
        function connectToRoom(roomName) {
            if (isFileProtocol) {
                gLog("⚠️ Cannot connect to WebSocket in file:// mode.");
                return;
            }
            var ws = new WebSocket('wss://euphoria.leet.nu/room/' + roomName + '/ws');
            ws.manualClose = false;
            ws.roomName = roomName;
            ws.onopen = function() {
                gLog("✅ Successfully connected to &" + roomName);
                roomLog(roomName, "--- TERMINAL OPENED: BOT ONLINE ---");
                roomLog(roomName, "Waiting for server ping...");
            };
            ws.onmessage = function(e) {
                var packet;
                try {
                    packet = JSON.parse(e.data);
                } catch (err) {
                    roomLog(roomName, "⚠️ Invalid JSON: " + e.data);
                    return;
                }
                if (packet.type === 'ping-event') {
                    ws.send(JSON.stringify({ type: 'ping-reply', data: { time: packet.data.time } }));
                    return;
                }
                if (packet.type === 'snapshot-event') {
                    roomLog(roomName, "--- Room snapshot ---");
                    ws.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                    roomLog(roomName, "-------------------- **USERS** -----------------------");
                    for (let i = 0; i < packet.data.listing.length; i++) {
                        let lst = packet.data.listing[i];
                        roomLog(roomName, `name: ${lst.name}`);
                    }
                    roomLog(roomName, "-------------------- **MSGs** -----------------------");
                    
                    for (let i = 0; i < packet.data.log.length; i++) {
                        let msg = packet.data.log[i];
                        roomLog(roomName, `@${msg.sender.name}: ${msg.content}`);
                        train(msg.content);
                        addToChatRecords(roomName, msg.sender.name, msg.content, msg.id);
                        addMessageToNotifyList(roomName, msg.sender.name, msg.content, msg.id);
                    }
                    roomLog(roomName, "-------------------- **STARTUP** -----------------------");
                    
                    return;
                }
                if (packet.type === 'bounce-event') {
                    roomLog(roomName, "⚠️ Room requires authentication – use auth/login command.");
                    return;
                }
                if (packet.type === 'send-reply') {
                    addMessageToNotifyList(roomName, packet.sender.name, packet.content, packet.data.id);
                    addToChatRecords(roomName, packet.sender.name, packet.content, packet.data.id);
                    return;
                }
                if (packet.type === 'send-event') {
                    var data = packet.data;
                    var text = data.content;
                    var sender = data.sender.name;
                    
                    addMessageToNotifyList(roomName, data.sender.name, text, data.id);
                    addToChatRecords(roomName, data.sender.name, text, data.id);
                    
                    var lowerText = text.toLowerCase();
                    var isMentioned = (lowerText.indexOf('@' + BOT_NAME) !== -1);
                    
                    if (lowerText.startsWith('!search')) {
                        if (handleSearchCommand(roomName, data.sender.name, text, data.id, ws)) {
                            return;
                        }
                    }
                    if (lowerText.includes('@ai')) {
                        handleAiPrompt(roomName, data.sender.name, text, data.id, ws);
                    }
                    if (lowerText.indexOf('!markov') !== 0) {
                        roomLog(roomName, "@" + sender + ": " + text);
                    } else {
                        roomLog(roomName, sender + " used command: " + text);
                    }
                    if (lowerText.includes("!help @markovbot")) {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'send', 
                                data: { 
                                    content: "@markovbot: Markov chain bot (n-gram 1-4) with !markov <seed>. AI router with @ai <prompt>. Search logs with !search <phrase>. Web app: https://peterforevergit.github.io/MBE/webapp/ | Maker: @peterforever + vibe | Commands: !help, !ping, !markov, @ai, !search", 
                                    parent: data.id 
                                }
                            }));
                        }
                    } else if (lowerText === '!ping' || (isMentioned && lowerText.indexOf('!ping') !== -1)) {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'send', 
                                data: { content: "pong! 🏓", parent: data.id }
                            }));
                        }
                    } else if (lowerText.indexOf('!markov') === 0) {
                        var seed = lowerText.replace('!markov', '').replace('@' + BOT_NAME, '').trim();
                        var reply = generate(seed);
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'send', 
                                data: { content: reply, parent: data.id }
                            }));
                        }
                        roomLog(roomName, "REPLIED: " + reply);
                    }
                }
            };
            ws.onclose = function() {
                if (!ws.manualClose) {
                    gLog("⚠️ Connection lost for &" + roomName + ". Retrying in 5s...");
                    setTimeout(function() { connectToRoom(roomName); }, 5000);
                }
            };
            ws.onerror = function(error) {
                gLog("⚠️ WebSocket error for &" + roomName + ": " + error.message);
            };
            connections[roomName] = ws;
        }

        // === NOTIFY LIST MANAGEMENT ===
        function addMessageToNotifyList(room, sender, text, id) {
            var ts = Date.now();
            recentMessages.unshift({room: room, sender: sender, text: text, id: id, ts: ts});
            if (recentMessages.length > maxMessages) {
                recentMessages.pop();
            }
            renderNotifyList();
        }

        function renderNotifyList(options) {
            options = options || {};
            var el = document.getElementById('notifyList');
            el.innerHTML = '';
            recentMessages.forEach(function(m, idx) {
                var item = document.createElement('div');
                item.className = 'notify-item' + (selectedMessage && selectedMessage.idx === idx ? ' selected' : '');
                item.onclick = function() { selectMessage(idx); };
                item.innerHTML = '<div><strong>&' + m.room + '</strong> <span class="notify-meta">' + m.sender + ' • ' + new Date(m.ts).toLocaleTimeString() + '</span></div><div>' + escapeHtml(m.text) + '</div>';
                el.appendChild(item);
            });
            if (notifyAutoScroll && !options.noScroll) {
                el.scrollTop = el.scrollHeight;
            }
        }

        function selectMessage(idx) {
            selectedMessage = Object.assign({ idx: idx }, recentMessages[idx]);
            document.getElementById('notifySelected').textContent = '&' + selectedMessage.room + ' / ' + selectedMessage.sender;
            document.getElementById('notifyReplyText').value = '';
            renderNotifyList({ noScroll: true });
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function sendInlineReply() {
            if (!selectedMessage) { alert('Select a message first from the list.'); return; }
            var text = document.getElementById('notifyReplyText').value.trim();
            if (!text) { alert('Write a message to send.'); return; }
            var room = selectedMessage.room;
            var conn = connections[room];
            if (!conn || conn.readyState !== WebSocket.OPEN) { alert('Connection for &' + room + ' is not open.'); return; }

            var usr = document.getElementById('notifyUsername').value.trim();
            if (!usr) usr = BOT_NAME;

            try {
                if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: usr } }));
                conn.send(JSON.stringify({ type: 'send', data: { content: text, parent: selectedMessage.id }}));
                if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                gLog('Sent inline reply to &' + room + ' as ' + usr + ': ' + text);

                recentMessages.unshift({ room: room, sender: usr, text: text, id: 'local-' + Date.now(), ts: Date.now() });
                if (recentMessages.length > maxMessages) recentMessages.pop();
            
                document.getElementById('notifyReplyText').value = '';
                renderNotifyList();
            } catch(e) {
                gLog('⚠️ Failed to send inline reply: ' + e);
            }
        }

        function sendToNullThread() {
            var room = document.getElementById('nullRoom').value.replace('&','').trim();
            if (!room) { alert('Enter a room to send to.'); return; }
            var text = document.getElementById('notifyReplyText').value.trim();
            if (!text) { alert('Write a message to send.'); return; }
            var conn = connections[room];
            if (!conn || conn.readyState !== WebSocket.OPEN) { alert('Connection for &' + room + ' is not open.'); return; }

            var usr = document.getElementById('notifyUsername').value.trim();
            if (!usr) usr = BOT_NAME;

            try {
                if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: usr } }));
                conn.send(JSON.stringify({ type: 'send', data: { content: text }}));
                if (usr !== BOT_NAME) conn.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                gLog('Sent null-thread message to &' + room + ' as ' + usr + ': ' + text);
  
                recentMessages.unshift({ room: room, sender: usr, text: text, id: 'local-' + Date.now(), ts: Date.now() });
                if (recentMessages.length > maxMessages) recentMessages.pop();
                
                document.getElementById('notifyReplyText').value = '';
                renderNotifyList();
            } catch(e) {
                gLog('⚠️ Failed to send null-thread message: ' + e);
            }
        }

        function exportLogs() {
            var logs = [];
            for (var room in chatRecords) {
                chatRecords[room].forEach(function(msg) {
                    logs.push({
                        room: room,
                        sender: msg.sender,
                        text: msg.text,
                        timestamp: msg.timestamp
                    });
                });
            }
            document.getElementById('logsText').value = JSON.stringify(logs, null, 2);
        }

        function importLogs() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot import logs in file:// mode.");
                return;
            }
            try {
                var text = document.getElementById('logsText').value.trim();
                if (!text) {
                    alert('No logs to import.');
                    return;
                }
                var logs = JSON.parse(text);
                if (!Array.isArray(logs)) {
                    alert('Invalid logs format. Expected an array.');
                    return;
                }
                chatRecords = {};
                logs.forEach(function(log) {
                    if (log.room && log.sender && log.text) {
                        if (!chatRecords[log.room]) {
                            chatRecords[log.room] = [];
                        }
                        chatRecords[log.room].push({
                            id: 'imported-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                            sender: log.sender,
                            text: log.text,
                            timestamp: log.timestamp || Date.now(),
                            room: log.room
                        });
                    }
                });
                saveChatRecords();
                gLog('✅ Imported ' + logs.length + ' log entries.');
                performSearch();
            } catch(e) {
                alert('Failed to import logs: ' + e.message);
            }
        }
    </script>
