<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MarkovBot Multi-Terminal Manager + AI (Flexible API)</title>
    <style>
        .close-btn {
            position: absolute;
            top: 50%;
            right: 5px;
            transform: translateY(-50%);
            background: #cc0000;
            color: white;
            border: none;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
            border-radius: 5px;
        }
        .close-btn:hover {
            background: #ff0000;
        }
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: #dcdcdc;
            padding: 15px;
            font-size: 13px;
            margin: 0;
        }
        .container { max-width: 1000px; margin: auto; }
        #globalLog {
            background: #000;
            border: 1px solid #444;
            height: 120px;
            overflow-y: scroll;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            margin-bottom: 10px;
            border-radius: 4px;
            color: #dcdcdc;
        }
        .controls {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            overflow-x: auto;
            background: #333;
            border-radius: 5px 5px 0 0;
            border: 1px solid #444;
            border-bottom: none;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            border-right: 1px solid #444;
            position: relative;
        }
        .tab-btn.active { background: #444; color: #00ff00; font-weight: bold; }
        .tab-content {
            background: #000;
            border: 1px solid #444;
            height: 350px;
            overflow-y: scroll;
            padding: 10px;
            font-family: monospace;
            border-radius: 0 0 5px 5px;
            color: #00ff00;
        }
        input, textarea, select {
            width: 100%;
            background: #000;
            color: #00ff00;
            border: 1px solid #555;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-red { background: #cc0000; margin-left: 10px; padding: 4px 8px; font-size: 10px; }
        .btn-green { background: #00cc00; margin-left: 10px; padding: 4px 8px; font-size: 10px; }
        .ai-controls {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
        .ai-status { font-size: 11px; color: #aaa; margin-top: 5px; }
        .ai-status.connected { color: #00ff00; }
        .ai-status.disconnected { color: #ff5555; }
        .notify-controls { padding: 10px; border-bottom: 1px solid #333; display: flex; gap: 8px; align-items: center; }
        .notify-list {
            height: 200px;
            overflow-y: auto;
            background: #0b0b0b;
            border-top: 1px solid #222;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        .notify-item { padding: 6px; border-bottom: 1px solid #111; cursor: pointer; }
        .notify-item.selected { background: rgba(0, 255, 0, 0.06); }
        .notify-meta { color: #999; font-size: 11px; }
        .chat-line { margin-bottom: 4px; border-bottom: 1px solid #111; }
        .maker-tag {
            font-size: 11px;
            color: #777;
            text-align: center;
            display: block;
            margin-top: 20px;
            font-style: italic;
        }
        #fileProtocolWarning {
            background: #ff5555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        .api-config {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            margin-top: 8px;
        }
        .api-config input, .api-config select {
            width: auto;
            flex: 1;
        }
        .api-config-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .model-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0b0b0b;
            border: 1px solid #333;
            padding: 8px;
            margin-top: 8px;
            display: none;
        }
        .model-item {
            padding: 4px;
            cursor: pointer;
            color: #00ff00;
        }
        .model-item:hover {
            background: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="fileProtocolWarning" style="display: none;">
            ⚠️ WARNING: This app requires a web server. Open via HTTP/HTTPS (not file://) for full functionality.
        </div>
        <h3>🌐 Global Connection Log</h3>
        <div id="globalLog"></div>
        
        <div class="ai-controls">
            <strong>🤖 AI API Configuration</strong>
            <div class="api-config-row">
                <input type="text" id="apiEndpoint" placeholder="API Endpoint URL">
                <button onclick="fetchModels()" class="btn-green">Fetch Models</button>
            </div>
            <div class="api-config-row">

            <div class="api-config-row">
                <select id="apiFormat">
                    <option value="openai">OpenAI Format</option>

                    <option value="custom">Custom JSON</option>
                </select>
                <input type="text" id="customPromptField" placeholder="Prompt Field (e.g., prompt)" style="display: none;">
                <input type="text" id="customResponseField" placeholder="Response Field (e.g., output)" style="display: none;">
                <button onclick="saveApiConfig()">Save Config</button>
                <button onclick="testAiConnection()">Test Connection</button>
            </div>
            <div class="model-list" id="modelList"></div>
            <div id="aiStatus" class="ai-status">API not configured</div>
        </div>
        
        <div class="controls">
            <strong>🔍 Chat Search & Records</strong>
            <div class="notify-controls">
                <input type="text" id="searchInput" placeholder="Search previous chats..." style="flex: 1;">
                <button onclick="performSearch()">Search</button>
                <button onclick="clearSearch()" class="btn-red">Clear</button>
            </div>
            <div id="searchResultsInfo" class="ai-status"></div>
            <div id="searchResults" class="notify-list"></div>
        </div>
        
        <div class="controls">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="newRoom" placeholder="Enter room name (e.g. test)">
                <button onclick="addRoom()">Connect & Open Terminal</button>
            </div>
        </div>
        
        <div class="tabs" id="tabBar">
            <button class="tab-btn" id="btn-notify" onclick="switchTab('notify')">💬 Direct Chat</button>
        </div>
        
        <div id="terminalContainer">
            <div class="tab-content" id="term-notify" style="display: none;">
                <div class="notify-controls">
                    <label>
                        <input type="checkbox" id="notifyEnable" onchange="saveNotifyPrefs()"> Enable
                    </label>
                    <label style="margin-left:8px;">
                        <input type="checkbox" id="notifyAutoScroll" onchange="saveNotifyPrefs()"> Auto-scroll
                    </label>
                    <input type="text" id="notifyUsername" placeholder="Reply username" style="flex:1; max-width:220px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                    <button class="small" onclick="saveUsername()">Save</button>
                </div>
                <div id="notifyList" class="notify-list"></div>
                <div class="notify-reply">
                    <div class="notify-meta">Selected: <span id="notifySelected">(none)</span></div>
                    <textarea id="notifyReplyText" rows="3" placeholder="Write your reply here..."></textarea>
                    <div style="display:flex; gap:8px; margin-top:6px;">
                        <button onclick="sendInlineReply()">Send Reply</button>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
                        <input id="nullRoom" placeholder="room for null thread (e.g. test)" style="flex:1; max-width:300px; background:#000; color:#00ff00; border:1px solid #555; padding:6px;">
                        <button class="big" onclick="sendToNullThread()">SEND TO NULL THREAD</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="controls" style="margin-top:20px;">
            <strong>📜 Log Management (Text-Based JSON):</strong>
            <textarea id="logsText" rows="2"></textarea>
            <button onclick="exportLogs()">Show Current Logs</button>
            <button onclick="importLogs()">Apply Text to Logs</button>
        </div>

        <div class="api-config-row">
        <label for="temperature" style="color: #00ff00; font-family: monospace;">Temperature:</label>
    <select id="temperature" onchange="updateTemperatureDisplay()" style="width: auto; flex: none;">
    <option value="0">0.0</option>
    <option value="0.1">0.1</option>
    <option value="0.2">0.2</option>
    <option value="0.3">0.3</option>
    <option value="0.4">0.4</option>
    <option value="0.5" selected>0.5</option>
    <option value="0.6">0.6</option>

    <option value="0.8">0.8</option>
    <option value="0.9">0.9</option>
    <option value="1.0">1.0</option>
    <option value="1.1">1.1</option>
    <option value="1.2">1.2</option>
    <option value="1.3">1.3</option>
    <option value="1.4">1.4</option>
    <option value="1.5">1.5</option>
    <option value="1.6">1.6</option>
    <option value="1.7">1.7</option>
    <option value="1.8">1.8</option>
    <option value="1.9">1.9</option>
    <option value="2.0">2.0</option>
        </select>
        </div>
        
        <span class="maker-tag">Maker: peterforever + vibe</span>
    </div>
    <script>
    // === LOCALSTORAGE PERSISTENCE ===
    function saveBrain() {
    
        gLog("⚠️ Failed to save brain: " + (e && e.message ? e.message : e));
        
    }

    function loadBrain() {
        initializeBrain();
    }

    // Call load on startup (place this after initializeBrain() or where initialization runs)
    if (typeof loadBrain === 'function') loadBrain();

    // Hook saving to beforeunload so users don't lose data
    if (typeof saveBrain === 'function') {
        window.addEventListener('beforeunload', saveBrain);
    }
    </script>
    <script>
        // === GLOBAL STATE ===
        var brain = { 1: {}, 2: {}, 3: {}, 4: {} };
        var connections = {};
        var BOT_NAME = 'markovbot';
        var activeTab = null;
        var notifyEnabled = false;
        var notifyAutoScroll = true;
        var recentMessages = [];
        var maxMessages = 200;
        var selectedMessage = null;
        var currentUserName = BOT_NAME;
        var aiBusy = false;
        var chatRecords = {};
        var isFileProtocol = window.location.protocol === 'file:';
        
        // AI API Configuration
        var apiEndpoint = '';
        var apiKey = '';
        var apiModel = '';
        var apiFormat = 'openai';
        var customPromptField = 'messages';
        var customResponseField = 'choices.0.message.content';

        // === INITIALIZATION ===
        function initializeBrain() {
            brain = { 1: {}, 2: {}, 3: {}, 4: {} };
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (isFileProtocol) {
                document.getElementById('fileProtocolWarning').style.display = 'block';
                gLog("⚠️ Running in file:// mode. WebSocket and localStorage will NOT work. Use a web server!");
            }
            initializeBrain();
            loadBrain();
            loadRooms();
            loadChatRecords();
            loadApiConfig();
            loadUsername();
            loadNotifyPrefs();
            
            // Setup API format change handler
            document.getElementById('apiFormat').addEventListener('change', function() {
                updateApiFormatFields();
            });
            updateApiFormatFields();
            
            gLog("✅ App initialized. Brain, rooms, and chat records loaded.");
        });

        function updateApiFormatFields() {
            const format = document.getElementById('apiFormat').value;
            const promptField = document.getElementById('customPromptField');
            const responseField = document.getElementById('customResponseField');
            
            if (format === 'custom') {
                promptField.style.display = 'inline-block';
                responseField.style.display = 'inline-block';
            } else {
                promptField.style.display = 'none';
                responseField.style.display = 'none';
            }
        }

        
        function saveRooms() {
            if (isFileProtocol) return;
            try {
                var rooms = Object.keys(connections);
                localStorage.setItem('markov_rooms', JSON.stringify(rooms));
            } catch(e) {
                gLog("⚠️ Failed to save rooms: " + e.message);
            }
        }

        function loadRooms() {
            if (isFileProtocol) return;
            try {
                var data = localStorage.getItem('markov_rooms');
                if (data) {
                    var rooms = JSON.parse(data);
                    rooms.forEach(function(room) {
                        if (!connections[room]) addRoom(room);
                    });
                }
            } catch(e) {
                gLog("⚠️ Failed to load rooms: " + e.message);
            }
        }

        // === API CONFIGURATION ===
        function saveApiConfig() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot save API config in file:// mode.");
                return;
            }
            apiEndpoint = document.getElementById('apiEndpoint').value.trim();
            apiKey = document.getElementById('apiKey').value.trim();
            apiModel = document.getElementById('apiModel').value.trim();
            apiFormat = document.getElementById('apiFormat').value;
            customPromptField = document.getElementById('customPromptField').value.trim() || 'prompt';
            customResponseField = document.getElementById('customResponseField').value.trim() || 'output';
            
            localStorage.setItem('mbe_api_endpoint', apiEndpoint);
            localStorage.setItem('mbe_api_key', apiKey);
            localStorage.setItem('mbe_api_model', apiModel);
            localStorage.setItem('mbe_api_format', apiFormat);
            localStorage.setItem('mbe_custom_prompt_field', customPromptField);
            localStorage.setItem('mbe_custom_response_field', customResponseField);
            
            gLog(`✅ API config saved: Endpoint=${apiEndpoint.substring(0, 30)}..., Model=${apiModel}`);
            updateAiStatus();
        }

        function loadApiConfig() {
            if (isFileProtocol) return;
            try {
                apiEndpoint = localStorage.getItem('mbe_api_endpoint') || '';
                apiKey = localStorage.getItem('mbe_api_key') || '';
                apiModel = localStorage.getItem('mbe_api_model') || '';
                apiFormat = localStorage.getItem('mbe_api_format') || 'openai';
                customPromptField = localStorage.getItem('mbe_custom_prompt_field') || 'messages';
                customResponseField = localStorage.getItem('mbe_custom_response_field') || 'choices.0.message.content';
                
                document.getElementById('apiEndpoint').value = apiEndpoint;
                document.getElementById('apiKey').value = apiKey;
                document.getElementById('apiModel').value = apiModel;
                document.getElementById('apiFormat').value = apiFormat;
                document.getElementById('customPromptField').value = customPromptField;
                document.getElementById('customResponseField').value = customResponseField;
                
                updateAiStatus();
            } catch(e) {
                gLog("⚠️ Failed to load API config: " + e.message);
            }
        }

        function updateAiStatus() {
            const statusEl = document.getElementById('aiStatus');
            if (!apiEndpoint) {
                statusEl.textContent = 'API not configured';
                statusEl.className = 'ai-status disconnected';
            } else {
                statusEl.textContent = `API: ${apiModel || 'No model'} @ ${apiEndpoint.substring(0, 30)}... (${apiFormat})`;
                statusEl.className = 'ai-status connected';
            }
        }

        // Fetch available models from the API endpoint
        async function fetchModels() {
            if (!apiEndpoint) {
                gLog("⚠️ API endpoint not configured.");
                return;
            }
            
            const modelListEl = document.getElementById('modelList');
            modelListEl.innerHTML = '<div class="model-item">Loading models...</div>';
            modelListEl.style.display = 'block';
            
            try {
                // Try common model listing endpoints
                const endpoints = [
                    `${apiEndpoint}/models`,
                    `${apiEndpoint}/v1/models`,
                    `${apiEndpoint.replace('/v1/chat/completions', '')}/v1/models`,
                    `${apiEndpoint}/api/tags`  // Ollama
                ];
                
                let models = [];
                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(endpoint, {
                            headers: apiKey ? { 'Authorization': `Bearer ${apiKey}` } : {}
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (Array.isArray(data.data)) {
                                models = data.data.map(m => m.id || m.name);
                            } else if (Array.isArray(data.models)) {
                                models = data.models.map(m => m.id || m.name);
                            } else if (Array.isArray(data)) {
                                models = data.map(m => m.id || m.name || m);
                            } else if (data.model) {
                                models = [data.model];
                            }
                            break;
                        }
                    } catch (e) {
                        // Try next endpoint
                    }
                }
                
                if (models.length > 0) {
                    modelListEl.innerHTML = '';
                    models.forEach(model => {
                        const item = document.createElement('div');
                        item.className = 'model-item';
                        item.textContent = model;
                        item.onclick = () => {
                            document.getElementById('apiModel').value = model;
                            modelListEl.style.display = 'none';
                        };
                        modelListEl.appendChild(item);
                    });
                } else {
                    modelListEl.innerHTML = '<div class="model-item">No models found or endpoint does not support model listing.</div>';
                }
            } catch (error) {
                modelListEl.innerHTML = `<div class="model-item">Error fetching models: ${error.message}</div>`;
            }
        }

        // === CHAT RECORDS PERSISTENCE ===
        function saveChatRecords() {
            if (isFileProtocol) return;
            try {
                localStorage.setItem('markov_chat_records', JSON.stringify(chatRecords));
            } catch(e) {
                gLog("⚠️ Failed to save chat records: " + e.message);
            }
        }

        function loadChatRecords() {
            if (isFileProtocol) return;
            try {
                var data = localStorage.getItem('markov_chat_records');
                if (data) {
                    chatRecords = JSON.parse(data);
                    gLog("📝 Chat records loaded from local storage.");
                }
            } catch(e) {
                gLog("⚠️ Failed to load chat records: " + e.message);
            }
        }

        function addToChatRecords(room, sender, text, messageId) {
            if (!chatRecords[room]) chatRecords[room] = [];
            deleteChatRecordByText(room, text);
            chatRecords[room].unshift({
                id: messageId || 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                sender: sender,
                text: text,
                timestamp: Date.now(),
                room: room
            });
            saveChatRecords();
        }

        function deleteChatRecord(room, messageId) {
            if (chatRecords[room]) {
                chatRecords[room] = chatRecords[room].filter(function(msg) {
                    return msg.id !== messageId;
                });
                saveChatRecords();
                performSearch();
            }
        }

        function deleteChatRecordByText(room, messageTxt) {
            if (chatRecords[room]) {
                chatRecords[room] = chatRecords[room].filter(function(msg) {
                    return msg.text !== messageTxt;
                });
                saveChatRecords();
                performSearch();
            }
        }

        // === SEARCH FUNCTIONALITY ===
        function searchChatRecords(query) {
            var results = [];
            var lowerQuery = query.toLowerCase();
            for (var room in chatRecords) {
                chatRecords[room].forEach(function(msg) {
                    if (msg.text.toLowerCase().includes(lowerQuery)) {
                        results.push({ room: room, sender: msg.sender, text: msg.text, id: msg.id, timestamp: msg.timestamp });
                    }
                });
            }
            return results.sort(function(a, b) { return b.timestamp - a.timestamp; });
        }

        function performSearch() {
            var query = document.getElementById('searchInput').value.trim();
            var resultsContainer = document.getElementById('searchResults');
            var resultsInfo = document.getElementById('searchResultsInfo');
            if (!query) {
                resultsContainer.innerHTML = '';
                resultsInfo.textContent = '';
                return;
            }
            var results = searchChatRecords(query);
            resultsInfo.textContent = `Found ${results.length} results for "${query}"`;
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="notify-item"><span>No results found</span></div>';
                return;
            }
            resultsContainer.innerHTML = '';
            results.forEach(function(result) {
                var item = document.createElement('div');
                item.className = 'notify-item';
                item.innerHTML = `
                    <div>
                        <strong>&${result.room}</strong>
                        <span class="notify-meta">${result.sender} • ${new Date(result.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div>${escapeHtml(result.text)}</div>
                    <button class="delete-btn btn-red" onclick="deleteChatRecord('${result.room}', '${result.id}'); event.stopPropagation();">Delete</button>
                `;
                resultsContainer.appendChild(item);
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchResultsInfo').textContent = '';
        }

        // === AI API CALL ===
        async function callAI(sys, prompt) {
            if (!apiEndpoint) {
                throw new Error('API endpoint not configured. Set it in the AI API Configuration section.');
            }
            if (!apiModel) {
                throw new Error('Model not configured. Set it in the AI API Configuration section.');
            }

            temperature = parseFloat(document.getElementById('temperature').value);

            try {
                // Build request based on format
                let requestBody, headers, url;
                
                if (apiFormat === 'openai') {
                    // Standard OpenAI format
                    url = apiEndpoint.endsWith('/chat/completions') ? apiEndpoint : 
                         (apiEndpoint.endsWith('/') ? apiEndpoint + 'chat/completions' : apiEndpoint + '/chat/completions');
    
                    const messages = [];
                    if (sys) messages.push({ role: "system", content: sys });

                    const userContent = prompt;

                    messages.push({ role: "user", content: userContent });
    
                    requestBody = {
            model: apiModel,
            messages: messages,
            temperature: temperature,
            max_tokens: 1000,
            stream: false
                   };
                   headers = {
            'Content-Type': 'application/json',
            ...(apiKey && { 'Authorization': `Bearer ${apiKey}` })
                    };
                }

                else if (apiFormat === 'raw') {
                    // Raw text format (just send prompt as string)
                    url = apiEndpoint;
                    requestBody = {
                        prompt: prompt,
                        model: apiModel,
                        temperature: 0.2,
                        max_tokens: 1000
                    };
                    headers = {
                        'Content-Type': 'application/json',
                        ...(apiKey && { 'Authorization': `Bearer ${apiKey}` })
                    };
                }
                else if (apiFormat === 'custom') {
                    // Custom JSON format
                    url = apiEndpoint;
                    const customBody = {};
                    customBody[customPromptField] = prompt;
                    if (sys) {
                        customBody.system = sys;
                    }
                    customBody.model = apiModel;
                    customBody.temperature = 0.2;
                    customBody.max_tokens = 1000;
                    
                    requestBody = customBody;
                    headers = {
                        'Content-Type': 'application/json',
                        ...(apiKey && { 'Authorization': `Bearer ${apiKey}` })
                    };
                }

                

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`API Error ${response.status}: ${errorData.message || errorData.error || 'Unknown error'}`);
                }

                const data = await response.json();
                
                // Parse response based on format
                if (apiFormat === 'openai') {
                    if (data.choices && data.choices[0]?.message?.content) {
                        return { choices: [{ message: { content: data.choices[0].message.content } }] };
                    }
                } else if (apiFormat === 'raw') {
                    if (data.response) {
                        return { choices: [{ message: { content: data.response } }] };
                    } else if (data.output) {
                        return { choices: [{ message: { content: data.output } }] };
                    } else if (typeof data === 'string') {
                        return { choices: [{ message: { content: data } }] };
                    }
                } else if (apiFormat === 'custom') {
                    // Try to extract content from custom response field
                    const fields = customResponseField.split('.');
                    let content = data;
                    for (const field of fields) {
                        if (content && content.hasOwnProperty(field)) {
                            content = content[field];
                        } else {
                            content = null;
                            break;
                        }
                    }
                    if (content !== null && content !== undefined) {
                        return { choices: [{ message: { content: content } }] };
                    }
                }
                
                // Fallback: try common fields
                if (data.content) {
                    return { choices: [{ message: { content: data.content } }] };
                } else if (data.output) {
                    return { choices: [{ message: { content: data.output } }] };
                } else if (data.text) {
                    return { choices: [{ message: { content: data.text } }] };
                } else if (data.message && data.message.content) {
                    return { choices: [{ message: { content: data.message.content } }] };
                } else if (Array.isArray(data) && data[0] && data[0].message && data[0].message.content) {
                    return { choices: [{ message: { content: data[0].message.content } }] };
                }
                
                throw new Error('Unexpected API response format. Received: ' + JSON.stringify(data).substring(0, 200));
                
            } catch (error) {
                throw new Error(`API request failed: ${error.message}`);
            }
        }

        async function testAiConnection() {
            if (isFileProtocol) {
                gLog("⚠️ Cannot test API in file:// mode.");
                return;
            }
            if (!apiEndpoint) {
                gLog("⚠️ API endpoint not configured.");
                return;
            }
            if (!apiModel) {
                gLog("⚠️ Model not configured.");
                return;
            }
            aiBusy = true;
            gLog("🔍 Testing API connection...");
            try {
                const response = await callAI("", "Say 'test successful'");
                if (response && response.choices && response.choices[0]) {
                    gLog("✅ API connection test passed!");
                } else {
                    gLog("❌ API connection test failed: Invalid response format");
                }
            } catch(error) {
                gLog("❌ API connection test failed: " + error.message);
            } finally {
                aiBusy = false;
            }
        }

        // === AI PROMPT HANDLING ===
        async function handleAiPrompt(room, sender, text, messageId, connection) {
            const term = document.getElementById(`term-${room}`);
            const context = term ? Array.from(term.querySelectorAll('.chat-line'))
                .slice(-10)
                .map(line => line.textContent)
                .join('\n') : 'No context';
            const prompt = text.trim();
            if (!prompt) return;
            const sys = `
Chat history:${context}

You are the smart AI chatbot @Gemma-AI for Euphoria chat room: &${room}. (you are a child bot of @markovbot)
You, the ai model is made by google. Euphoria bot is made by peterforever.
Users can use "@ai <prompt>" to adress you
User used @ai command to call you.
Answer 40 words or more if necessary.
Detect if anouther bot is automatically triggering you or if you are in a loop and return nothing in that case.
@${sender} prompted you with: ${prompt}
`;     
            roomLog(room, `@${sender} prompted: ${text}`);
            aiBusy = true;
            try {
                connection.send(JSON.stringify({ type: 'nick', data: { name: "Gemma-AI"} }));
                
                const response = await callAI(sys, prompt);
                if (response && response.choices && response.choices[0]?.message?.content) {
                    const aiResponse = response.choices[0].message.content.trim();
                    connection.send(JSON.stringify({ type: 'send', data: { content: aiResponse + " - generated by local Gemma AI model", parent: messageId } }));
                }
            } catch(error) {
                roomLog(room, `AI Error: ${error.message}`);
            } finally {
                if (connection.readyState === WebSocket.OPEN) {
                    connection.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                }
                aiBusy = false;
            }
        }

        function handleSearchCommand(room, sender, text, messageId, connection) {
            const searchMatch = text.match(/!search\\s+(.+)/i);
            if (!searchMatch) return false;
            const query = searchMatch[1].trim();
            const results = searchChatRecords(query);
            if (results.length === 0) {
                if (connection.readyState === WebSocket.OPEN) {
                    connection.send(JSON.stringify({ type: 'send', data: { content: `No results found for "${query}"`, parent: messageId } }));
                }
            } else {
                const resultText = results.slice(0, 20).map(r => 
                    `[&${r.room}] ${r.sender}: ${r.text.substring(0, 100)}${r.text.length > 100 ? '...' : ''}`
                ).join(' | ');
                if (connection.readyState === WebSocket.OPEN) {
                    connection.send(JSON.stringify({ 
                        type: 'send', 
                        data: { 
                            content: `Search results for "${query}": \n ${resultText}${results.length > 20 ? ` (+${results.length - 20} more)` : ''}`,
                            parent: messageId 
                        } 
                    }));
                }
            }
            return true;
        }

                var keys = ['markov_username', 'markov_name', 'markov_nick'];
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    var v = localStorage.getItem(k);

                }
                var explicit = localStorage.getItem('markov_username');
                if (explicit) currentUserName = explicit;
                document.getElementById('notifyUsername').value = currentUserName === BOT_NAME ? '' : currentUserName;
            } catch(e) { gLog('⚠️ Failed to load username: ' + e.message); }
        }

        function saveUsername() {
            if (isFileProtocol) { gLog("⚠️ Cannot save username in file:// mode."); return; }
            try {
                var v = document.getElementById('notifyUsername').value.trim();
                if (v.length === 0) {
                    currentUserName = BOT_NAME;
                    localStorage.removeItem('markov_username');
                } else {
                    currentUserName = v;
                    localStorage.setItem('markov_username', currentUserName);
                }
                gLog('Saved reply username: ' + currentUserName);
            } catch(e) { gLog('⚠️ Failed to save username: ' + e.message); }
        }

        function loadNotifyPrefs() {
            if (isFileProtocol) return;
            try {
                var auto = localStorage.getItem('markov_notify_autoscroll');

            } catch(e) { gLog('⚠️ Failed to load notify prefs: ' + e.message); }

        function saveNotifyPrefs() {

        // === LOGGING ===
        function gLog(msg) {
            var entry = document.createElement('div');
            entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            document.getElementById('globalLog').appendChild(entry);
            document.getElementById('globalLog').scrollTop = document.getElementById('globalLog').scrollHeight;
        }

        function roomLog(roomName, msg) {
            var term = document.getElementById('term-' + roomName);
            if (term) {
                var entry = document.createElement('div');
                entry.className = 'chat-line';
                entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
                term.appendChild(entry);
                term.scrollTop = term.scrollHeight;
            }
        }

        // === MARKOV CHAIN ===
        function train(text) {
            return;
        }

        function generate(seedText) {
            if (Object.keys(chatRecords).length === 0) loadChatRecords();
            var tempBrain = { 1: {}, 2: {}, 3: {}, 4: {} };
            for (var room in chatRecords) {
                chatRecords[room].forEach(function(msg) {
                    if (msg.text && typeof msg.text === 'string') {
                        var text = msg.text.toLowerCase().trim();
                        if (text.length === 0) return;
                        var words = text.split(/\s+/);
                        words.push(".");
                        for (var n = 1; n <= 4; n++) {
                            for (var i = 0; i <= words.length - n - 1; i++) {
                                var key = words.slice(i, i + n).join(' ');
                                var next = words[i + n];
                                if (!tempBrain[n][key]) tempBrain[n][key] = [];
                                tempBrain[n][key].push(next);
                            }
                        }
                    }
                });
            }
            var seedWords = seedText.toLowerCase().trim().split(/\s+/);
            if (seedWords.length === 0) {
                var allMessages = [];
                for (var room in chatRecords) allMessages = allMessages.concat(chatRecords[room]);
                if (allMessages.length > 0) {
                    var randomMsg = allMessages[Math.floor(Math.random() * allMessages.length)];
                    seedWords = randomMsg.text.toLowerCase().trim().split(/\s+/).slice(0, 2);
                } else { return "no messages to generate from."; }
            }
            var result = seedWords.slice();
            for (var i = 0; i < 50; i++) {
                var found = false;
                var maxN = Math.min(4, result.length);
                for (var n = maxN; n >= 1; n--) {
                    var key = result.slice(result.length - n).join(' ');
                    if (tempBrain[n][key] && tempBrain[n][key].length > 0) {
                        var options = tempBrain[n][key];
                        var next = options[Math.floor(Math.random() * options.length)];
                        if (next === ".") return result.join(' ');
                        result.push(next);
                        found = true;
                        break;
                    }
                }
                if (!found) break;
            }
            return result.join(' ');
        }

        // === ROOM TERMINAL MANAGEMENT ===
        function switchTab(roomName) {
            activeTab = roomName;
            var buttons = document.getElementsByClassName('tab-btn');
            for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
            var btn = document.getElementById('btn-' + roomName);
            if (btn) btn.classList.add('active');
            else if (roomName === 'notify') document.getElementById('btn-notify').classList.add('active');
            var contents = document.getElementsByClassName('tab-content');
            for (var i = 0; i < contents.length; i++) contents[i].style.display = 'none';
            var t = document.getElementById('term-' + roomName);
            if (t) t.style.display = 'block';
            if (roomName === 'notify') document.getElementById('term-notify').style.display = 'block';
        }

        function removeRoom(roomName) {
            if (connections[roomName]) {
                connections[roomName].manualClose = true;
                connections[roomName].close();
                delete connections[roomName];
            }
            var btn = document.getElementById('btn-' + roomName);
            if (btn) btn.remove();
            var term = document.getElementById('term-' + roomName);
            if (term) term.remove();
            gLog("Closed terminal for &" + roomName);
            saveRooms();
            var remaining = Object.keys(connections);
            if (remaining.length > 0) switchTab(remaining[0]);
        }
        
        function addRoom(roomName) {
            var r = roomName || document.getElementById('newRoom').value.replace('&', '').trim();
            if (r && !connections[r]) {
                var btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.id = 'btn-' + r;
                btn.innerHTML = '&' + r + ' <span class="btn-red" onclick="removeRoom(\'' + r + '\'); event.stopPropagation();">X</span>';
                btn.onclick = function() { switchTab(r); };
                document.getElementById('tabBar').appendChild(btn);
                var term = document.createElement('div');
                term.className = 'tab-content';
                term.id = 'term-' + r;
                term.style.display = 'none';
                document.getElementById('terminalContainer').appendChild(term);
                connectToRoom(r);
                switchTab(r);
                if (!roomName) document.getElementById('newRoom').value = "";
                saveRooms();
            }
        }

        // === WEBSOCKET CONNECTION ===
        function connectToRoom(roomName) {
            if (isFileProtocol) {
                gLog("⚠️ Cannot connect to WebSocket in file:// mode.");
                return;
            }
            var ws = new WebSocket('wss://euphoria.leet.nu/room/' + roomName + '/ws');
            ws.manualClose = false;
            ws.roomName = roomName;
            ws.onopen = function() {
                gLog("✅ Successfully connected to &" + roomName);
                roomLog(roomName, "--- TERMINAL OPENED: BOT ONLINE ---");
                roomLog(roomName, "Waiting for server ping...");
            };
            ws.onmessage = function(e) {
                var packet;
                try { packet = JSON.parse(e.data); }
                catch (err) { roomLog(roomName, "⚠️ Invalid JSON: " + e.data); return; }
                
                if (packet.type === 'ping-event') {
                    ws.send(JSON.stringify({ type: 'ping-reply', data: { time: packet.data.time} }));
                    return;
                }
                if (packet.type === 'snapshot-event') {
                    roomLog(roomName, "--- Room snapshot ---");
                    ws.send(JSON.stringify({ type: 'nick', data: { name: BOT_NAME } }));
                    roomLog(roomName, "-------------------- **USERS** -----------------------");
                    for (let i = 0; i < packet.data.listing.length; i++) {
                        let lst = packet.data.listing[i];
                        roomLog(roomName, `name: ${lst.name}`);
                    }
                    roomLog(roomName, "-------------------- **MSGs** -----------------------");
                    for (let i = 0; i < packet.data.log.length; i++) {
                        let msg = packet.data.log[i];
                        roomLog(roomName, `@${msg.sender.name}: ${msg.content}`);
                        addToChatRecords(roomName, msg.sender.name, msg.content, msg.id);
                        addMessageToNotifyList(roomName, msg.sender.name, msg.content, msg.id);
                    }
                    roomLog(roomName, "-------------------- **STARTUP** -----------------------");
                    return;
                }
                if (packet.type === 'bounce-event') {
                    roomLog(roomName, "⚠️ Room requires authentication – use auth/login command.");
                    return;
                }
                if (packet.type === 'send-reply') {
                    roomLog(roomName, "@"+packet.sender.name+": "+packet.content);
                    addMessageToNotifyList(roomName, packet.sender.name, packet.content, packet.data.id);
                    addToChatRecords(roomName, packet.sender.name, packet.content, packet.data.id);
                    return;
                }
                if (packet.type === 'send-event') {
                    var data = packet.data;
                    var text = data.content;
                    var sender = data.sender.name;
                    addMessageToNotifyList(roomName, data.sender.name, text, data.id);
                    addToChatRecords(roomName, data.sender.name, text, data.id);
                    var lowerText = text.toLowerCase();
                    var isMentioned = (lowerText.indexOf('@' + BOT_NAME) !== -1);
                    if (lowerText.startsWith('!search')) {
                        handleSearchCommand(roomName, data.sender.name, text, data.id, ws);
                        handleAiPrompt(roomName, data.sender.name, "Summarize search", data.id, ws);
                        return;
                    }
                    if (lowerText.includes('@ai')) {
                        handleAiPrompt(roomName, data.sender.name, text, data.id, ws);
                    }
                    if (lowerText.indexOf('!markov') !== 0) {
                        roomLog(roomName, "@" + sender + ": " + text);
                    } else {
                        roomLog(roomName, sender + " used command: " + text);
                    }
                    if (lowerText.includes("!help @markovbot")) {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'send', 
                                data: { 
                                    content: "@markovbot: Markov chain bot (n-gram 1-4) with !markov <seed>. AI router with @ai <prompt>. Search logs with !search <phrase>. Web app: https://peterforevergit.github.io/MBE/webapp/ | Maker: @peterforever + vibe | Commands: !help, !ping, !markov, @ai, !search", 
                                    parent: data.id 
                                } 
                            }));
                            handleAiPrompt(roomName, data.sender.name, "explain who you are and how to use @ai command", data.id, ws);
                        }
                    }
                    if (lowerText === '!ping' || (isMentioned && lowerText.indexOf('!ping') !== -1)) {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'send', data: { content: "pong! 🏓", parent: data.id } }));
                        }
                    }
                    if (lowerText.indexOf('!markov') === 0) {
                        var seed = lowerText.replace('!markov', '').replace('@' + BOT_NAME, '').trim();
                        var reply = generate(seed);
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'send', data: { content: reply, parent: data.id } }));
                        }
                        roomLog(roomName, "REPLIED: " + reply);
                    }
                    if (lowerText.includes("!aicommand")) {
                        handleAiPrompt(roomName, data.sender.name, text + "This is a special command, you have to use minimum words to say what you think is the right answer to the command, for example '!aicommand 8ball' -> 'Cloudy...' and '!aicommand coin' -> 'heads' and '!aicommand 2*3' -> '6'", data.id, ws);
                    }
                }
            };
            ws.onclose = function() {
                if (!ws.manualClose) {
                    gLog("⚠️ Connection lost for &" + roomName + ". Retrying in 5s...");
                    setTimeout(function() { connectToRoom(roomName); }, 5000);
                }
            };
            ws.onerror = function(error) {
                gLog("⚠️ WebSocket error for &" + roomName + ": " + error.message);
            };
            connections[roomName] = ws;
        }

        // === NOTIFY LIST MANAGEMENT ===
        function addMessageToNotifyList(room, sender, text, id) {
            var ts = Date.now();
            recentMessages.unshift({ room: room, sender: sender, text: text, id: id, ts: ts });
            if (recentMessages.length > maxMessages) recentMessages.pop();
            renderNotifyList();
        }

        function renderNotifyList(options) {
            options = options || {};
            var el = document.getElementById('notifyList');
            el.innerHTML = '';
            recentMessages.forEach(function(m, idx) {
                var item = document.createElement('div');
                item.className = 'notify-item' + (selectedMessage && selectedMessage.idx === idx ? ' selected' : '');
                item.onclick = function() { selectMessage(idx); };
                item.innerHTML = `
                    <div>
                        <strong>&${m.room}</strong>
                        <span class="notify-meta">${m.sender} • ${new Date(m.ts).toLocaleTimeString()}</span>
                    </div>
                    <div>${escapeHtml(m.text)}</div>
                `;
                el.appendChild(item);
            });
            if (notifyAutoScroll && !options.noScroll) el.scrollTop = el.scrollHeight;
        }

        function selectMessage(idx) {
            selectedMessage = Object.assign({ idx: idx }, recentMessages[idx]);
            document.getElementById('notifySelected').textContent = `&${selectedMessage.room} • ${selectedMessage.sender}`;
            document.getElementById('notifyReplyText').value = '';
            document.getElementById('notifyReplyText').focus();
            renderNotifyList({ noScroll: true });
        }

        function sendInlineReply() {
            if (!selectedMessage) return;
            var reply = document.getElementById('notifyReplyText').value.trim();
            if (!reply) return;
            var connection = connections[selectedMessage.room];
            if (connection && connection.readyState === WebSocket.OPEN) {
                connection.send(JSON.stringify({ type: 'send', data: { content: reply, parent: selectedMessage.id } }));
                roomLog(selectedMessage.room, `REPLIED: ${reply}`);
            }
        }

        function sendToNullThread() {
            var room = document.getElementById('nullRoom').value.trim();
            var reply = document.getElementById('notifyReplyText').value.trim();
            if (!room || !reply) return;
            var connection = connections[room];
            if (connection && connection.readyState === WebSocket.OPEN) {
                connection.send(JSON.stringify({ type: 'send', data: { content: reply } }));
                roomLog(room, `SENT TO NULL THREAD: ${reply}`);
            }
        }

        function exportLogs() {
            document.getElementById('logsText').value = JSON.stringify(chatRecords, null, 2);
        }

        function importLogs() {
            try {
                var text = document.getElementById('logsText').value.trim();
                if (!text) return;
                chatRecords = JSON.parse(text);

                gLog("⚠️ Failed to import logs: " + e.message);

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateTemperatureDisplay() {
            temperature = parseFloat(document.getElementById('temperature').value);
            gLog(`🌡️ Temperature set to: ${temperature}`);
        }
